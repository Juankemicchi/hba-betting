<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Betting</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0a0e1a;
      color: #e5e7eb;
    }
    .header {
      background: #111827;
      padding: 16px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
    }
    .logo {
      font-size: 1.65rem;
      font-weight: 700;
      color: #fbbf24;
      letter-spacing: 0.5px;
    }
    .sports {
      display: flex;
      gap: 10px;
    }
    .sport-btn {
      background: #1f2937;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 999px;
      cursor: pointer;
      font-weight: 500;
      font-size: 0.95rem;
    }
    .sport-btn.active {
      background: #3b82f6;
    }
    .vip-btn {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      color: #111827;
      border: none;
      padding: 10px 20px;
      border-radius: 999px;
      font-weight: 700;
      cursor: pointer;
    }
    .container {
      max-width: 1080px;
      margin: 28px auto;
      padding: 0 20px;
    }
    .card {
      background: #111827;
      border-radius: 16px;
      padding: 28px;
      border: 1px solid #1f2937;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      margin: 18px 0 24px;
    }
    input, select {
      padding: 12px 14px;
      border-radius: 10px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      font-size: 1rem;
      min-width: 180px;
    }
    .analyze-btn {
      background: #10b981;
      border: none;
      padding: 12px 26px;
      border-radius: 10px;
      font-weight: 700;
      cursor: pointer;
      color: white;
    }
    .metrics {
      display: flex;
      gap: 14px;
      margin: 8px 0 18px;
      flex-wrap: wrap;
    }
    .metric {
      background: #1f2937;
      padding: 16px 22px;
      border-radius: 12px;
      text-align: center;
      min-width: 130px;
    }
    .metric span {
      display: block;
      font-size: 1.8rem;
      font-weight: 700;
      color: #10b981;
      margin-top: 4px;
    }
    .analysis {
      background: #0f172a;
      border-radius: 12px;
      padding: 16px 18px;
      margin: 16px 0;
      border-left: 3px solid #fbbf24;
      line-height: 1.5;
    }
    .chart-container {
      margin-top: 10px;
      background: #0f172a;
      border-radius: 12px;
      padding: 14px;
    }
    .support {
      margin-top: 36px;
      text-align: center;
      color: #9ca3af;
      font-size: 0.9rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">HBA BETTING</div>
    <div class="sports">
      <button class="sport-btn active">NBA</button>
      <button class="sport-btn">Fútbol <small style="color:#f59e0b">(En desarrollo)</small></button>
      <button class="sport-btn">Tenis <small style="color:#f59e0b">(En desarrollo)</small></button>
      <button class="sport-btn">E-Sports <small style="color:#f59e0b">(En desarrollo)</small></button>
    </div>
    <button class="vip-btn">VIP AI Assistant</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>NBA Player Props Analyzer</h2>
      
      <div class="controls">
        <input type="text" id="player" placeholder="Nombre del jugador" value="Luka Doncic">
        <select id="prop">
          <option value="PTS">Puntos</option>
          <option value="REB">Rebotes</option>
          <option value="AST">Asistencias</option>
          <option value="PRA">Puntos + Rebotes + Asistencias</option>
          <option value="PR">Puntos + Rebotes</option>
          <option value="PA">Puntos + Asistencias</option>
          <option value="RA">Rebotes + Asistencias</option>
          <option value="FG3M">Triples</option>
          <option value="MIN">Minutos</option>
          <option value="DD">Double-Double</option>
          <option value="TD">Triple-Double</option>
        </select>
        <select id="line"></select>
        <button class="analyze-btn" onclick="analyze()">Analizar</button>
      </div>

      <div id="result"></div>
    </div>

    <div class="support">
      ¿Dudas, quejas o soporte? Escríbenos a <b>soporte@hbabetting.com</b>
    </div>
  </div>

  <script>
    const lineSelect = document.getElementById('line');
    for (let i = 0; i < 100; i++) {
      const val = (i + 0.5).toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.text = val;
      if (val === "25.5") opt.selected = true;
      lineSelect.appendChild(opt);
    }

    let chartInstance = null;

    function generateAnalysis(stats) {
      const { player, avg, hit_rate, games, line, prop } = stats;
      const hits = Math.round((hit_rate / 100) * games);

      let text = `<b>${player}</b> ha promediado <b>${avg}</b> en ${prop} en sus últimos ${games} partidos. `;
      
      if (hit_rate >= 70) {
        text += `Ha superado la línea de <b>${line}</b> en <b>${hits} de ${games}</b> partidos (${hit_rate}%). Es un pick con buen respaldo reciente.`;
      } else if (hit_rate >= 50) {
        text += `Ha superado la línea de <b>${line}</b> en <b>${hits} de ${games}</b> partidos (${hit_rate}%). Es un pick intermedio, conviene revisar el contexto del partido.`;
      } else {
        text += `Solo ha superado la línea de <b>${line}</b> en <b>${hits} de ${games}</b> partidos (${hit_rate}%). El respaldo reciente es bajo.`;
      }

      return text;
    }

    async function analyze() {
      const player = document.getElementById('player').value.trim();
      const prop = document.getElementById('prop').value;
      const line = parseFloat(document.getElementById('line').value);
      const resultDiv = document.getElementById('result');

      resultDiv.innerHTML = "<p>Analizando...</p>";

      try {
        const response = await fetch("https://hba-backend.onrender.com/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ player, prop, line, last_n: 12 })
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<p style="color:#ef4444">${data.detail}</p>`;
          return;
        }

        const s = data.stats;
        const games = data.games || [];

        resultDiv.innerHTML = `
          <h3>${s.player}</h3>
          <div class="metrics">
            <div class="metric">Promedio <span>${s.avg}</span></div>
            <div class="metric">Hit Rate <span>${s.hit_rate}%</span></div>
            <div class="metric">Partidos <span>${s.games}</span></div>
          </div>
          <div class="analysis">
            <strong>Análisis del Pick</strong><br>
            ${generateAnalysis(s)}
          </div>
          <div class="chart-container">
            <canvas id="chart"></canvas>
          </div>
        `;

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('chart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: games.map((_, i) => `J${i+1}`),
            datasets: [{
              label: s.prop,
              data: games.map(g => g[s.value_col] || 0),
              backgroundColor: games.map(g => g.Over ? '#10b981' : '#ef4444')
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: '#1f2937' } },
              x: { grid: { display: false } }
            }
          }
        });

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:#ef4444">Error de conexión.</p>`;
      }
    }
  </script>

</body>
</html>

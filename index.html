<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Sports Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>■</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://hba-backend.onrender.com" crossorigin>
  <link rel="dns-prefetch" href="https://hba-backend.onrender.com">
  <link rel="preconnect" href="https://media.api-sports.io">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #080c16;
      --bg2: #0c1220;
      --card: #121a2b;
      --card2: #172136;
      --border: #243049;
      --text: #e8eefc;
      --muted: #8b9bb8;
      --gold: #f3c15e;
      --green: #2ee59d;
      --red: #ff4d6a;
      --blue: #5b8cff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: radial-gradient(1200px 500px at 10% -10%, #15203a 0%, var(--bg) 55%); color: var(--text); min-height: 100vh; }
    button, input, select { font-family: inherit; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: rgba(8,12,22,.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #f3c15e, #c9922d); color: #1a1305; display: grid; place-items: center; font-weight: 800; letter-spacing: -.04em; }
    .brand-name { font-weight: 800; letter-spacing: .12em; font-size: 1.05rem; }
    .brand-sub { font-size: .68rem; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .9rem; }
    .tab:hover { color: var(--text); }
    .tab.active { background: #1a2742; color: var(--text); border-color: var(--border); }
    .tab.disabled { opacity: .45; cursor: not-allowed; }
    .tab small { display: block; font-size: .62rem; font-weight: 500; letter-spacing: .04em; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
    .search-wrap { position: relative; max-width: 760px; margin: 0 auto 18px; }
    .search-wrap input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 16px 18px 16px 46px; font-size: 1rem; outline: none; }
    .search-wrap input:focus { border-color: var(--gold); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 380px; overflow: auto; display: none; z-index: 30; }
    .suggest.open { display: block; }
    .sg-sec { padding: 8px 12px 4px; font-size: .7rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .sg-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
    .sg-item:hover { background: var(--card2); }
    .sg-item img { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; background: #0b1020; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
    .chip { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .82rem; }
    .chip.active { color: #1a1305; background: var(--gold); border-color: var(--gold); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
    .team-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 10px; text-align: center; cursor: pointer; }
    .team-card:hover, .team-card.active { border-color: var(--gold); }
    .team-card img { width: 58px; height: 58px; object-fit: contain; margin-bottom: 8px; }
    .team-card strong { display: block; font-size: .86rem; }
    .team-card span { display: block; color: var(--muted); font-size: .72rem; margin-top: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .toolbar input, .toolbar select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 10px; }
    .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg button { background: transparent; border: 0; color: var(--muted); padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .82rem; }
    .seg button.active { background: #1e2d4d; color: var(--text); }
    .btn { background: var(--gold); border: 0; color: #1a1305; font-weight: 800; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
    .btn:hover { filter: brightness(1.05); }
    .hint { color: var(--muted); font-size: .85rem; }
    .err { color: var(--red); font-size: .9rem; }
    .dash { display: grid; grid-template-columns: minmax(0, 1.4fr) 320px; gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
    .kpi { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .kpi .num { font-size: 3rem; font-weight: 800; letter-spacing: -.04em; line-height: .9; }
    .kpi .lbl { color: var(--muted); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .trend { font-weight: 700; font-size: .9rem; }
    .trend.up { color: var(--green); } .trend.down { color: var(--red); }
    .chart-box { height: 220px; }
    .spot { text-align: center; }
    .spot img, .spot .crest { width: 86px; height: 86px; object-fit: cover; border-radius: 50%; background: #0b1020; margin-bottom: 8px; border: 2px solid var(--border); }
    .spot .crest { object-fit: contain; border-radius: 16px; padding: 6px; }
    .spot h2 { font-size: 1.15rem; margin: 4px 0; }
    .gauge-wrap { display: grid; place-items: center; margin: 12px 0; }
    .gauge { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .gauge::after { content: ""; position: absolute; inset: 14px; background: var(--card); border-radius: 50%; }
    .gauge span { position: relative; z-index: 1; font-weight: 800; font-size: 1.35rem; }
    .stars { color: var(--gold); letter-spacing: 2px; margin: 6px 0; }
    .lean { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: .78rem; letter-spacing: .06em; }
    .lean.OVER { background: rgba(46,229,157,.12); color: var(--green); }
    .lean.UNDER { background: rgba(255,77,106,.12); color: var(--red); }
    .lean.NEUTRAL { background: #1e2d4d; color: var(--muted); }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .prop { display: grid; grid-template-columns: minmax(110px,1.3fr) 78px 96px 58px 72px; gap: 8px; align-items: center; padding: 8px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
    .prop:hover, .prop.active { background: var(--card2); border-color: var(--border); }
    .prop .name { font-size: .85rem; }
    .prop .avg, .prop .line, .prop .pct { font-size: .8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .prop .pct.hot { color: var(--green); font-weight: 700; }
    .prop .pct.cold { color: var(--red); font-weight: 700; }
    .prop input { width: 64px; background: #0b1020; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 4px 6px; }
    .step { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #0b1020; }
    .step button { width: 22px; height: 26px; border: 0; background: transparent; color: var(--text); cursor: pointer; font-size: .95rem; }
    .step button:hover { background: #1e2d4d; }
    .step span { min-width: 34px; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
    .seg.yesno button { padding: 5px 10px; font-size: .78rem; }
    .lean.SI { background: rgba(46,229,157,.12); color: var(--green); }
    .lean.NO { background: rgba(255,77,106,.12); color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
    .pill { padding: 2px 7px; border-radius: 999px; font-weight: 800; font-size: .7rem; }
    .pill.hit { background: rgba(46,229,157,.15); color: var(--green); }
    .pill.miss { background: rgba(255,77,106,.15); color: var(--red); }
    .ai p { line-height: 1.55; font-size: .92rem; color: #d5def0; white-space: pre-wrap; }
    .ai h3 { color: var(--gold); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
    .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
    .squad-item { min-width: 88px; text-align: center; cursor: pointer; }
    .squad-item img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #0b1020; }
    .squad-item div { font-size: .7rem; margin-top: 4px; color: var(--muted); }
    .footer { max-width: 1280px; margin: 0 auto; padding: 10px 20px 28px; color: var(--muted); font-size: .78rem; text-align: center; line-height: 1.5; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }

    .top-actions { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; margin-left: auto; }
    .vip-btn { background: linear-gradient(135deg, #f8d27a, #e0a83a 55%, #c9922d); border: 0; color: #1a1305; font-weight: 800; font-size: .78rem; letter-spacing: .04em; padding: 8px 14px; border-radius: 999px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; box-shadow: 0 0 0 1px rgba(243,193,94,.28), 0 8px 18px rgba(201,146,45,.22); white-space: nowrap; }
    .vip-btn:hover { filter: brightness(1.06); }
    .vip-star { font-size: .95rem; }
    .vip-overlay { position: fixed; inset: 0; background: rgba(4,8,16,.72); z-index: 50; display: flex; justify-content: flex-end; }
    .vip-panel { width: min(580px, 100%); height: 100%; background: var(--bg2); border-left: 1px solid var(--border); overflow: auto; padding: 18px 18px 28px; box-shadow: var(--shadow); display: flex; flex-direction: column; gap: 14px; }
    .vip-head { display: flex; align-items: flex-start; justify-content: space-between; gap: 12px; }
    .vip-kicker { color: var(--gold); font-size: .7rem; letter-spacing: .14em; text-transform: uppercase; font-weight: 700; margin-bottom: 4px; }
    .vip-head h2 { font-size: 1.25rem; }
    .vip-close { width: 34px; height: 34px; border-radius: 10px; border: 1px solid var(--border); background: var(--card); color: var(--text); cursor: pointer; font-size: 1.2rem; }
    .vip-tabs { display: flex; gap: 6px; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 4px; }
    .vip-tab { flex: 1; background: transparent; border: 0; color: var(--muted); padding: 8px 8px; border-radius: 9px; cursor: pointer; font-weight: 700; font-size: .78rem; }
    .vip-tab.active { background: #1e2d4d; color: var(--text); }
    .vip-gate { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 22px 18px; }
    .vip-gate h3 { margin-bottom: 8px; }
    .vip-gate p { color: var(--muted); font-size: .9rem; line-height: 1.5; margin-bottom: 14px; }
    .vip-gate input, #vip-app input, #vip-app select, #vip-app textarea, .vip-app input, .vip-app select, .vip-app textarea { width: 100%; background: #0b1020; border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 10px 12px; margin-bottom: 10px; color-scheme: dark; display: block; }
    #vip-app textarea { min-height: 96px; resize: vertical; }
    .vip-gate .btn, .vip-app .btn { width: auto; }
    .vip-soon { font-size: .78rem; color: var(--muted); margin: 8px 0 14px; }
    .vip-pick { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 14px 14px 12px; margin-bottom: 10px; }
    .vip-pick-top { display: flex; justify-content: space-between; gap: 8px; align-items: flex-start; }
    .vip-rank { color: var(--gold); font-weight: 800; font-size: .75rem; letter-spacing: .08em; }
    .vip-pick.maxima { border-color: var(--gold); }
    .vip-maxima { display: inline-block; margin-left: 8px; background: linear-gradient(90deg, #c9a227, #f0d78c); color: #1a1408; font-weight: 800; font-size: .68rem; letter-spacing: .04em; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; vertical-align: middle; }
    .vip-match { font-weight: 700; }
    .vip-meta { color: var(--muted); font-size: .75rem; margin: 2px 0 8px; }
    .vip-market { font-size: .92rem; margin-bottom: 6px; }
    .vip-stats { display: flex; flex-wrap: wrap; gap: 8px; margin: 8px 0; }
    .vip-stat { background: var(--card2); border: 1px solid var(--border); border-radius: 10px; padding: 6px 8px; min-width: 72px; }
    .vip-stat b { display: block; font-size: .95rem; }
    .vip-stat span { color: var(--muted); font-size: .65rem; letter-spacing: .06em; text-transform: uppercase; }
    .vip-reason { color: #d5def0; font-size: .86rem; line-height: 1.5; }
    .risk-baja { color: var(--green); } .risk-media { color: var(--gold); } .risk-alta { color: var(--red); }
    .verdict { display: inline-block; font-weight: 800; font-size: .72rem; letter-spacing: .06em; padding: 3px 8px; border-radius: 8px; text-transform: uppercase; }
    .verdict.strong { background: rgba(46,229,157,.12); color: var(--green); }
    .verdict.mixed { background: #1e2d4d; color: var(--muted); }
    .verdict.weak { background: rgba(255,77,106,.12); color: var(--red); }

    .support-link { color: var(--muted); font-size: .82rem; font-weight: 600; text-decoration: none; padding: 8px 10px; }
    .support-link:hover { color: var(--text); }
    .site-footer { max-width: 1280px; margin: 0 auto; padding: 18px 20px 28px; color: var(--muted); font-size: .78rem; text-align: center; line-height: 1.5; }
    .site-footer a { color: #f0d78c; text-decoration: none; font-weight: 700; }
    .site-footer a:hover { text-decoration: underline; }
    .vip-support { color: var(--muted); font-size: .78rem; margin: 10px 4px 0; }
    .vip-support a { color: #f0d78c; text-decoration: none; font-weight: 700; }
    .vip-support a:hover { text-decoration: underline; }
    .hist-summary { display: grid; grid-template-columns: repeat(5, 1fr); gap: 8px; margin: 12px 0 16px; }
    .hist-stat { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 10px 8px; text-align: center; }
    .hist-stat b { display: block; font-size: 1.05rem; }
    .hist-stat span { color: var(--muted); font-size: .7rem; }
    .hist-day { margin: 16px 0 8px; font-weight: 700; font-size: .92rem; }
    .hist-result { font-weight: 800; font-size: .78rem; letter-spacing: .03em; text-transform: uppercase; white-space: nowrap; }
    .hist-result.ganado { color: #7dffb0; }
    .hist-result.perdido { color: #ff8d8d; }
    .hist-result.nulo, .hist-result.pendiente { color: var(--muted); }
    .hist-units { color: var(--muted); font-size: .78rem; margin-top: 6px; }
    .vip-disclaimer { color: var(--muted); font-size: .72rem; line-height: 1.45; margin-top: auto; }
    /* Top 3 del día */
    .top3 { position: relative; background: linear-gradient(160deg, rgba(243,193,94,.14), rgba(18,26,43,.9) 45%); border: 1px solid rgba(243,193,94,.55); border-radius: 18px; padding: 14px 12px 6px; margin: 4px 0 16px; box-shadow: 0 10px 28px rgba(201,146,45,.12); }
    .top3-head { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 0 4px 10px; }
    .top3-title { color: var(--gold); font-weight: 800; font-size: .82rem; letter-spacing: .12em; text-transform: uppercase; }
    .top3-sub { color: var(--muted); font-size: .7rem; }
    .top3-item { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; background: rgba(8,12,22,.55); border: 1px solid var(--border); border-radius: 14px; padding: 10px; margin-bottom: 8px; }
    .top3-item.maxima { border-color: var(--gold); }
    .top3-medal { width: 34px; height: 34px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .95rem; color: #1a1305; background: linear-gradient(135deg, #f8d27a, #c9922d); }
    .top3-medal.r2 { background: linear-gradient(135deg, #e6ebf5, #9aa6bd); }
    .top3-medal.r3 { background: linear-gradient(135deg, #f0b98a, #a8663a); }
    .top3-main { min-width: 0; }
    .top3-match { font-weight: 700; font-size: .86rem; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .top3-market { font-size: .8rem; color: #d5def0; margin-top: 2px; }
    .top3-meta { font-size: .68rem; color: var(--muted); margin-top: 3px; }
    .top3-level { display: inline-block; font-size: .62rem; font-weight: 800; letter-spacing: .04em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: #1e2d4d; color: #c8d4ee; margin-top: 4px; }
    .top3-level.maxima { background: linear-gradient(90deg, #c9a227, #f0d78c); color: #1a1408; }
    .top3-level.alta { background: rgba(46,229,157,.14); color: var(--green); }
    .top3-odd { text-align: right; }
    .top3-odd b { display: block; font-size: 1.05rem; color: var(--text); }
    .top3-odd span { font-size: .62rem; color: var(--muted); letter-spacing: .06em; text-transform: uppercase; }
    .vip-fixed { color: var(--gold); font-weight: 700; }
    .vip-status { display: inline-block; margin-left: 6px; font-size: .6rem; font-weight: 800; letter-spacing: .05em; text-transform: uppercase; padding: 2px 6px; border-radius: 6px; background: #1e2d4d; color: #c8d4ee; vertical-align: middle; }
    .vip-status.live { background: rgba(91,140,255,.18); color: #9db8ff; }
    .vip-status.won { background: rgba(46,229,157,.15); color: #7dffb0; }
    .vip-status.lost { background: rgba(255,77,106,.15); color: #ff8d8d; }
    .top3-note { color: var(--muted); font-size: .68rem; margin: 2px 4px 8px; line-height: 1.4; }

    /* Chat VIP: AI chat look */
    .ai-chat { display: flex; flex-direction: column; height: calc(100vh - 232px); height: calc(100dvh - 232px); min-height: 380px; margin-top: 10px; background: linear-gradient(180deg, rgba(12,18,32,.6), rgba(8,12,22,.9)); border: 1px solid var(--border); border-radius: 18px; overflow: hidden; }
    .ai-chat-head { display: flex; align-items: center; gap: 10px; padding: 10px 12px; border-bottom: 1px solid var(--border); background: rgba(8,12,22,.75); backdrop-filter: blur(8px); }
    .ai-avatar { flex: 0 0 auto; width: 30px; height: 30px; border-radius: 50%; display: grid; place-items: center; font-weight: 900; font-size: .8rem; color: #1a1305; background: linear-gradient(135deg, #f8d27a, #e0a83a 55%, #c9922d); box-shadow: 0 0 0 2px rgba(243,193,94,.18); }
    .ai-avatar.lg { width: 56px; height: 56px; font-size: 1.4rem; box-shadow: 0 0 0 6px rgba(243,193,94,.10), 0 10px 30px rgba(201,146,45,.25); }
    .ai-head-txt { flex: 1; min-width: 0; }
    .ai-head-name { font-weight: 800; font-size: .9rem; }
    .ai-head-status { font-size: .7rem; color: var(--muted); display: flex; align-items: center; gap: 5px; }
    .ai-dot-online { width: 7px; height: 7px; border-radius: 50%; background: var(--green); box-shadow: 0 0 8px var(--green); }
    .ai-new { background: transparent; border: 1px solid var(--border); color: var(--muted); border-radius: 999px; padding: 6px 10px; font-size: .72rem; font-weight: 700; cursor: pointer; }
    .ai-new:hover { color: var(--text); border-color: #3a4a6b; }
    .ai-log { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 12px 8px; display: flex; flex-direction: column; gap: 14px; scroll-behavior: smooth; overscroll-behavior: contain; -webkit-overflow-scrolling: touch; }
    .ai-row { display: flex; gap: 8px; align-items: flex-end; animation: aiIn .22s ease-out; }
    .ai-row.user { justify-content: flex-end; }
    .ai-col { display: flex; flex-direction: column; max-width: 84%; min-width: 0; }
    .ai-row.user .ai-col { align-items: flex-end; }
    .ai-msg { padding: 10px 13px; border-radius: 18px; font-size: .9rem; line-height: 1.55; word-wrap: break-word; overflow-wrap: anywhere; }
    .ai-row.assistant .ai-msg { background: var(--card); border: 1px solid var(--border); border-bottom-left-radius: 6px; color: #e3eaf8; }
    .ai-row.user .ai-msg { background: linear-gradient(135deg, #2a3d66, #1e2d4d); border: 1px solid #34497a; border-bottom-right-radius: 6px; white-space: pre-wrap; }

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatError(data) {
  const d = data && data.detail;
  if (!d) return "No se pudo completar la consulta.";
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => x && x.msg).filter(Boolean).join(". ") || "Revisa los datos e inténtalo de nuevo.";
  return "No se pudo completar la consulta.";
}
function setStatus(msg, isErr) {
  const el = document.getElementById("status");
  el.className = isErr ? "err" : "hint";
  el.textContent = msg || "";
}
function sparkSvg(values) {
  const nums = (values || []).map(v => Number(v.value)).filter(v => !Number.isNaN(v));
  if (nums.length < 2) return "";
  const w = 72, h = 22, min = Math.min(...nums), max = Math.max(...nums);
  const span = max - min || 1;
  const pts = nums.map((n, i) => {
    const x = (i / (nums.length - 1)) * (w - 2) + 1;
    const y = h - 2 - ((n - min) / span) * (h - 4);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="#5b8cff" stroke-width="1.6" points="${pts}"/></svg>`;
}

function setSport(name) {

}

}

const searchInput = document.getElementById("main-search");
const suggestBox = document.getElementById("suggest");
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { suggestBox.classList.remove("open"); return; }
  searchTimer = setTimeout(() => runSearch(q), 280);
});
searchInput.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); runSearch(searchInput.value.trim(), true); } });
document.addEventListener("click", ev => { if (!ev.target.closest(".search-wrap")) suggestBox.classList.remove("open"); });

async function runSearch(q, openFirst) {
  if (!q || q.length < 2) return;
  try {
    const endpoint = sport === "nba" ? "/api/nba/search" : "/api/football/search";
    const res = await fetch(`${API_BASE}${endpoint}?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const teams = data.teams || [];
    const players = data.players || [];
    if (openFirst && teams[0]) { suggestBox.classList.remove("open"); openEntity("team", teams[0]); return; }
    if (openFirst && players[0]) { suggestBox.classList.remove("open"); openEntity("player", players[0]); return; }
    let html = "";
    if (teams.length) {
      html += `<div class="sg-sec">Equipos</div>` + teams.map(t => `
        <div class="sg-item" data-kind="team" data-id="${t.id}" data-name="${escapeHtml(t.name)}">
          ${t.logo ? `<img loading="lazy" src="${t.logo}" alt="">` : ""}
          <div><strong>${escapeHtml(t.name)}</strong><div class="muted" style="font-size:.75rem">${escapeHtml(t.country || "")}</div></div>
        </div>`).join("");
    }
    if (players.length) {
      html += `<div class="sg-sec">Jugadores</div>` + players.map(p => `
        <div class="sg-item" data-kind="player" data-id="${p.id}" data-name="${escapeHtml(p.fullname || p.name)}" data-team="${p.team_id || ""}" data-team-name="${escapeHtml(p.team_name || "")}">
          ${p.photo ? `<img loading="lazy" src="${p.photo}" alt="">` : ""}
          <div><strong>${escapeHtml(p.fullname || p.name)}</strong><div class="muted" style="font-size:.75rem">${escapeHtml(p.position || "")} ${escapeHtml(p.nationality || "")}</div></div>
        </div>`).join("");
    }
    if (!html) html = `<div class="sg-item muted">Sin resultados</div>`;
    suggestBox.innerHTML = html;
    suggestBox.classList.add("open");
    suggestBox.querySelectorAll(".sg-item[data-id]").forEach(el => {
      el.addEventListener("click", () => {
        suggestBox.classList.remove("open");
        searchInput.value = el.dataset.name || "";
        openEntity(el.dataset.kind, { id: el.dataset.id, name: el.dataset.name, team_id: el.dataset.team, team_name: el.dataset.teamName });
      });
    });
  } catch (e) {
    suggestBox.innerHTML = `<div class="sg-item err">Error de conexión</div>`;
    suggestBox.classList.add("open");
  }
}


function openEntity(kind, item) {
  suggestBox.classList.remove("open");
  if (!item) return;
  if (kind === "team") {
    if (sport === "nba") openNbaTeam(item.id, item.name);

  } else if (sport === "nba") {
    openNbaPlayer(item.id, item.name || item.fullname, item.team_id, false, item.team_name);
  } else {
    openPlayer(Number(item.id), item.name || item.fullname, item.team_id ? Number(item.team_id) : undefined);
  }
}

    dashState.payload = cached;

    setStatus(`Cargando estadísticas de ${name}…`);

    if ((!(data.team && data.team.name)) && dashState.teamName) {
      data.team = Object.assign({}, data.team || {}, { name: dashState.teamName });
    }
    dashState.payload = data;
    dashState.market = data.primary;
    writeStatsCache("nba", body, data);
    setStatus("");
    renderFromState();
  } catch (e) {
    if (!cached) setStatus("Error de conexión. Si el servidor estaba dormido, inténtalo de nuevo.", true);
  }
}

function ftParams() {
  const lastN = Number((document.getElementById("ft-lastn") || {}).value || 10);
  const venue = (document.getElementById("ft-venue") || {}).value || "all";
  const opponent = ((document.getElementById("ft-opp") || {}).value || "").trim();
  return { last_n: lastN, venue, opponent: opponent || null };
}

function renderFtToolbar(kind) {
  const bar = document.getElementById("ft-toolbar");
  if (sport !== "football" && sport !== "nba") { bar.classList.add("hidden"); return; }
  const s = dashState || {};
  const last = (s.payload && s.payload.last_n) || 10;
  const venue = (s.payload && s.payload.venue) || "all";
  const opp = (s.opponent) || "";
  bar.classList.remove("hidden");
  bar.innerHTML = `
    <div class="seg" id="ft-lastn-seg">

function statsCacheKey(kind, body) {
  return "hba-stats:" + kind + ":" + JSON.stringify(body);
}
function readStatsCache(kind, body) {
  try {
    const item = JSON.parse(sessionStorage.getItem(statsCacheKey(kind, body)) || "null");
    if (item && Date.now() - item.ts < 30 * 60 * 1000) return item.data;
  } catch (e) {}
  return null;
}
function writeStatsCache(kind, body, data) {
  try { sessionStorage.setItem(statsCacheKey(kind, body), JSON.stringify({ ts: Date.now(), data })); } catch (e) {}
}

async function openTeam(id, name, keepToolbar) {

  renderFtToolbar("team");
  const params = ftParams();

  const cached = readStatsCache("team", body);
  if (cached) {
    dashState.payload = cached;
    dashState.market = cached.primary;
    setStatus("");
    renderFromState();
  } else {
    setStatus(`Cargando estadísticas de ${name}…`);

  try {
    const res = await fetch(`${API_BASE}/api/football/analyze/team`, { method: "POST", headers: {"Content-Type":"application/json"}, body: JSON.stringify(body) });
    const data = await res.json();
    if (!res.ok) { setStatus(formatError(data), true); return; }

function snapHalf(n) {
  const x = Number(n);
  if (!Number.isFinite(x)) return 0.5;
  return Math.max(0.5, Math.round(x - 0.5) + 0.5);
}
function sideLabel(side) { return side === "no" ? "No" : "Sí"; }
function recomputeMarket(stat, line) {
  if (stat.kind === "yesno") {
    const side = (line === "no" || line === "No") ? "no" : "yes";
    const values = (stat.values || []).map(v => {
      const happened = Number(v.value) === 1;
      return { ...v, line: side, over: side === "yes" ? happened : !happened };
    });
    const games = values.length;
    const hits = values.filter(v => v.over).length;
    const yesHits = values.filter(v => Number(v.value) === 1).length;
    const yesRate = games ? Math.round(yesHits * 1000 / games) / 10 : null;
    return {
      ...stat, line: side, side, values, hits, games,
      yes_rate: yesRate,
      no_rate: yesRate == null ? null : Math.round((100 - yesRate) * 10) / 10,
      avg: games ? Math.round(yesHits / games * 100) / 100 : null,
      hit_rate: games ? Math.round(hits * 1000 / games) / 10 : null
    };
  }
  const snapped = snapHalf(line);
  const values = (stat.values || []).map(v => ({ ...v, line: snapped, over: Number(v.value) > snapped }));
  const games = values.length;
  const hits = values.filter(v => v.over).length;
  const avg = games ? Math.round(values.reduce((s, v) => s + Number(v.value), 0) / games * 100) / 100 : null;
  return { ...stat, line: snapped, values, hits, games, avg, hit_rate: games ? Math.round(hits * 1000 / games) / 10 : null };
}

function clientRecommend(market) {
  if (!market || !market.games) return { lean: "NEUTRAL", confidence: 1 };
  const hit = market.hit_rate;
  const games = market.games;
  const avg = market.avg;
  const line = market.line;
  let lean;
  if (market.kind === "yesno") {
    const yesRate = market.yes_rate;
    if (yesRate >= 65) lean = "SI";
    else if (yesRate <= 35) lean = "NO";
    else lean = "NEUTRAL";
  } else if (hit >= 65 && avg != null && avg > line) lean = "OVER";
  else if (hit <= 35 && avg != null && avg < line) lean = "UNDER";
  else lean = "NEUTRAL";
  let conf;
  if (games < 5) conf = 2;
  else if (lean === "NEUTRAL") conf = (hit >= 45 && hit <= 55) ? 3 : 2;
  else if ((hit >= 75 && games >= 8) || (market.kind === "yesno" && (market.yes_rate >= 75 || market.yes_rate <= 25) && games >= 8)) conf = 5;
  else if (hit >= 65 || hit <= 35) conf = 4;
  else conf = 3;
  return { lean, confidence: conf, market: market.key, label: market.label, line: market.kind === "yesno" ? (market.side || market.line) : line, hit_rate: hit, avg };
}
function activeMarket() {
  if (!dashState || !dashState.payload) return null;
  const stats = dashState.payload.stats || {};
  return stats[dashState.market] || stats[dashState.payload.primary] || Object.values(stats)[0];
}

function renderGauge(pct) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const color = p >= 55 ? "var(--green)" : p <= 40 ? "var(--red)" : "var(--gold)";
  const label = (pct == null || Number.isNaN(Number(pct))) ? "–" : p.toFixed(0);
  return `<div class="gauge-wrap"><div class="gauge" style="background: conic-gradient(${color} ${p}%, #243049 0)"><span>${label}%</span></div></div>`;
}
function renderStars(n) {
  const c = Math.max(1, Math.min(5, Number(n) || 1));
  return `<div class="stars">${"★".repeat(c)}${"☆".repeat(5-c)}</div>`;
}
function renderAI(text, pending) {
  if (pending || !text) return `<div class="card ai" id="ai-card"><h3>Análisis de IA</h3><p class="hint">Generando análisis…</p></div>`;
  return `<div class="card ai" id="ai-card"><h3>Análisis de IA</h3><p>${escapeHtml(text)}</p></div>`;
}

const insightCache = new Map();
let insightTimer = null;
let insightAbort = null;
let insightReqId = 0;

function insightKey() {
  if (!dashState || !dashState.payload) return "";
  const d = dashState.payload;
  const m = activeMarket() || {};
  const line = m.kind === "yesno" ? (m.side || m.line || "yes") : m.line;
  return [
    dashState.kind || "",
    dashState.id || dashState.name || "",
    m.key || "",
    line,
    d.last_n || "",
    d.venue || "all",
    (dashState.opponent || d.opponent || "")
  ].join("|");
}

function paintAI(text, pending) {
  const box = document.getElementById("ai-card");
  if (!box) return;
  box.outerHTML = renderAI(text, pending);
}

function scheduleInsight() {
  if (!dashState || !dashState.payload) return;
  const key = insightKey();
  if (!key) return;
  if (insightCache.has(key)) {
    const text = insightCache.get(key);
    dashState.payload.ai_analysis = text;
    dashState.payload.ai_key = key;
    paintAI(text, false);
    return;
  }
  dashState.payload.ai_analysis = null;
  dashState.payload.ai_key = key;
  paintAI(null, true);
  clearTimeout(insightTimer);
  if (insightAbort) { try { insightAbort.abort(); } catch (e) {} insightAbort = null; }
  insightTimer = setTimeout(() => fetchInsight(key), 700);
}

function fetchInsight(expectedKey) {
  if (!dashState || !dashState.payload) return;
  const key = expectedKey || insightKey();
  if (key !== insightKey()) return;
  if (insightCache.has(key)) {
    const text = insightCache.get(key);
    dashState.payload.ai_analysis = text;
    paintAI(text, false);
    return;
  }
  const market = activeMarket();
  if (!market) return;
  const rec = clientRecommend(market) || {};
  const data = dashState.payload;
  const person = data.player || data.team || {};
  const isYesNo = market.kind === "yesno";
  const body = {
    kind: dashState.kind,
    name: person.fullname || person.name || dashState.name,
    entity_id: dashState.id,
    market: market.key,
    label: market.label,
    line: isYesNo ? (market.side || market.line || "yes") : market.line,
    side: isYesNo ? (market.side || market.line || "yes") : null,
    market_kind: isYesNo ? "yesno" : "line",
    avg: market.avg,
    hit_rate: market.hit_rate,
    hits: market.hits,
    games: market.games,
    yes_rate: market.yes_rate,
    no_rate: market.no_rate,
    lean: rec.lean,
    confidence: rec.confidence,
    values: (market.values || []).slice(0, 10),
    last_n: data.last_n,
    venue: data.venue || "all",
    opponent: dashState.opponent || null,
    form: data.form,
    record: data.record || null,
    team: (data.team && data.team.name) || person.team_name || dashState.teamName || null,
    season: data.season,
    is_goalkeeper: !!data.is_goalkeeper
  };
  if (insightAbort) { try { insightAbort.abort(); } catch (e) {} }
  const ac = new AbortController();
  insightAbort = ac;
  const reqId = ++insightReqId;
  fetch(`${API_BASE}/api/insight`, {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify(body),
    signal: ac.signal
  }).then(r => r.json()).then(res => {
    if (reqId !== insightReqId) return;
    if (!dashState || insightKey() !== key) return;
    const text = res && res.ai_analysis;
    if (!text) { paintAI("No se pudo generar el análisis. Inténtalo de nuevo.", false); return; }
    if (insightCache.size > 80) {
      const first = insightCache.keys().next().value;
      insightCache.delete(first);
    }
    insightCache.set(key, text);
    dashState.payload.ai_analysis = text;
    paintAI(text, false);
  }).catch(err => {
    if (err && err.name === "AbortError") return;
    if (reqId !== insightReqId) return;
    if (!dashState || insightKey() !== key) return;
    paintAI("No se pudo generar el análisis. Inténtalo de nuevo.", false);
  });
}


function renderFromState() {
  const dash = document.getElementById("dash");
  if (!dashState || !dashState.payload) { dash.classList.add("hidden"); return; }
  dash.classList.remove("hidden");
  const data = dashState.payload;
  const stats = data.stats || {};
  const market = activeMarket();
  const rec = clientRecommend(market) || data.recommendation || {};
  const isPlayer = dashState.kind === "player" || dashState.kind === "nba";
  const isYesNo = market && market.kind === "yesno";
  const person = isPlayer ? (data.player || {}) : (data.team || {});
  const photo = isPlayer ? person.photo : person.logo;
  const title = isPlayer ? (person.fullname || person.name) : person.name;
  const teamName = (data.team && data.team.name) || person.team_name || "";
  const sub = isPlayer
    ? [teamName, person.position, `${data.played || 0} partidos`].filter(Boolean).join(" · ")
    : `${(data.league && data.league.name) || ""} · temporada ${data.season || ""} · ${data.form || ""}`;
  const pct = market && market.hit_rate;
  const lineTxt = market
    ? (isYesNo ? `${market.label} ${sideLabel(market.side || market.line)}` : `${market.label} ${market.line}`)
    : "";
  const leanRaw = (rec.lean || "NEUTRAL");
  const lean = leanRaw === "SÍ" ? "SI" : leanRaw;
  const leanPretty = lean === "SI" ? "SÍ" : lean;
  const leanLine = isYesNo ? "" : (market ? market.line : "");
  const leanLabel = market ? `${leanPretty}${leanLine !== "" ? " " + leanLine : ""} ${market.label}` : leanPretty;

  const formHint = !isPlayer && data.record
    ? `${data.record.wins}W-${data.record.draws}E-${data.record.losses}D`
    : (isPlayer && data.season_totals && data.season_totals.leagues
        ? data.season_totals.leagues.map(l => `${l.league || ""}: ${l.appearances || 0} PJ, ${l.goals ?? "–"} goles`).join(" · ")
        : (dashState.kind === "nba" ? `${data.played || (market && market.games) || 0} partidos` : ""));

  const rowsHtml = Object.values(stats).map(m => {
    if (!m) return "";
    if (m.key === "saves" && dashState.kind === "player" && !data.is_goalkeeper) return "";
    const hot = m.hit_rate >= 60 ? "hot" : m.hit_rate <= 40 ? "cold" : "";
    const active = m.key === (dashState.market) ? " active" : "";
    const avgTxt = m.kind === "yesno"
      ? (m.yes_rate == null ? "–" : m.yes_rate + "% Sí")
      : (m.avg == null ? "–" : m.avg + " avg");
    const lineCtl = m.kind === "yesno"
      ? `<div class="seg yesno" data-key="${m.key}"><button type="button" data-side="yes" class="${(m.side||m.line)!=="no"?"active":""}">Sí</button><button type="button" data-side="no" class="${(m.side||m.line)==="no"?"active":""}">No</button></div>`
      : `<div class="step" data-key="${m.key}"><button type="button" data-dir="-1">−</button><span>${m.line}</span><button type="button" data-dir="1">+</button></div>`;
    return `<div class="prop${active}" data-key="${m.key}">
      <div class="name">${escapeHtml(m.label)}</div>
      <div class="avg">${avgTxt}</div>
      <div class="line">${lineCtl}</div>
      <div class="pct ${hot}">${m.hit_rate == null ? "–" : m.hit_rate + "%"}</div>
      ${sparkSvg(m.values)}
    </div>`;
  }).join("");

  const values = (market && market.values) ? market.values : [];
  const tableRows = values.map(v => `
    <tr>
      <td>${escapeHtml((v.date || "").slice(0,10))}</td>
      <td>${escapeHtml(v.opponent || "")} ${v.venue === "home" ? "(L)" : v.venue === "away" ? "(V)" : ""}</td>
      <td>${isYesNo ? sideLabel(v.line) : v.line}</td>
      <td>${isYesNo ? (v.display || sideLabel(Number(v.value)===1?"yes":"no")) : v.value}</td>
      <td><span class="pill ${v.over ? "hit" : "miss"}">${v.over ? "HIT" : "MISS"}</span></td>
    </tr>`).join("");

  const h2h = (!isPlayer && data.h2h && data.h2h.length) ? `
    <div class="card"><h3 style="margin-bottom:8px;font-size:.9rem;">H2H reciente</h3>
      ${data.h2h.slice(0,8).map(m => `<div class="hint" style="margin:4px 0">${escapeHtml((m.date||"").slice(0,10))} · ${escapeHtml(m.home)} ${m.goals_home}-${m.goals_away} ${escapeHtml(m.away)}</div>`).join("")}
    </div>` : "";

  dash.innerHTML = `
    <div class="dash">
      <div class="col">
        <div class="card kpi">
          <div>
            <div class="lbl">Hit rate · ${escapeHtml(lineTxt)}</div>
            <div class="num">${pct == null ? "–" : pct.toFixed(1) + "%"}</div>
            <div class="hint" style="margin-top:8px">${escapeHtml(formHint)} · ${market ? market.hits + "/" + market.games + (isYesNo ? ((market.side||market.line)==="no" ? " No" : " Sí") : " over") : ""}</div>
          </div>
        </div>
        <div class="card"><div class="chart-box"><canvas id="main-chart"></canvas></div></div>
        <div class="card">
          <h3 style="margin-bottom:8px;font-size:.9rem;">Desglose de props</h3>
          <div class="rows">${rowsHtml}</div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:8px;font-size:.9rem;">Partidos recientes</h3>
          <div style="overflow-x:auto"><table>
            <thead><tr><th>Fecha</th><th>Rival</th><th>Línea</th><th>Valor</th><th></th></tr></thead>
            <tbody>${tableRows || `<tr><td colspan="5" class="hint">Sin partidos para esta métrica.</td></tr>`}</tbody>
          </table></div>
        </div>
        ${h2h}
      </div>
      <div class="col">
        <div class="card spot">
          ${photo ? `<img loading="lazy" class="${isPlayer ? "" : "crest"}" src="${photo}" alt="">` : ""}
          <h2>${escapeHtml(title || "")}</h2>
          <div class="hint">${escapeHtml(sub)}</div>
          ${renderGauge(pct)}
          ${renderStars(rec.confidence)}
          <div class="lean ${lean}">LEAN ${escapeHtml(leanLabel)}</div>
          <div class="hint" style="margin-top:8px">${isYesNo ? `Sí ${market && market.yes_rate != null ? market.yes_rate + "%" : "–"} · No ${market && market.no_rate != null ? market.no_rate + "%" : "–"}` : `Promedio ${market && market.avg != null ? market.avg : "–"} vs línea ${market ? market.line : "–"}`}</div>
        </div>
        ${renderAI((insightCache.has(insightKey()) ? insightCache.get(insightKey()) : null), !insightCache.has(insightKey()))}
        ${isPlayer ? '' : '<div class="card" id="squad-card"></div>'}
      </div>
    </div>`;

  if (!isPlayer && currentSquad.length) loadSquad(dashState.id);
  else if (!isPlayer) { /* squad loading */ }

  dash.querySelectorAll(".prop").forEach(el => el.addEventListener("click", ev => {
    if (ev.target.closest(".step, .yesno, button")) return;
    dashState.market = el.dataset.key;
    renderFromState();
  }));
  dash.querySelectorAll(".step button").forEach(btn => btn.addEventListener("click", ev => {
    ev.stopPropagation();
    const key = btn.parentElement.dataset.key;
    const dir = Number(btn.dataset.dir);
    const current = Number((dashState.payload.stats[key] || {}).line);
    const line = snapHalf(current + dir);
    dashState.payload.stats[key] = recomputeMarket(dashState.payload.stats[key], line);
    dashState.market = key;
    renderFromState();
  }));
  dash.querySelectorAll(".yesno button").forEach(btn => btn.addEventListener("click", ev => {
    ev.stopPropagation();
    const key = btn.parentElement.dataset.key;
    dashState.payload.stats[key] = recomputeMarket(dashState.payload.stats[key], btn.dataset.side);
    dashState.market = key;
    if (dashState.payload.recommendation) {
      dashState.payload.recommendation = Object.assign({}, dashState.payload.recommendation, { line: btn.dataset.side });
    }
    renderFromState();
  }));
  drawChart(values, isYesNo ? 0.5 : (market && market.line), market && market.label, isYesNo);
  scheduleInsight();
}

function drawChart(values, line, label, yesNo) {
  const canvas = document.getElementById("main-chart");
  if (!canvas || typeof Chart === "undefined") return;
  if (chartInst) chartInst.destroy();
  const series = [...(values || [])].reverse();
  const labels = series.map(v => (v.opponent || "").slice(0, 10) || (v.date || "").slice(5, 10));
  chartInst = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: label || "Valor",
          data: series.map(v => v.value),
          borderColor: "#5b8cff",
          backgroundColor: "rgba(91,140,255,.12)",
          fill: true,
          tension: 0.25,
          pointRadius: 5,
          pointBackgroundColor: series.map(v => v.over ? "#2ee59d" : "#ff4d6a"),
          pointBorderColor: "#0b1020"
        },
        {
          label: yesNo ? "Sí / No" : "Línea",
          data: series.map(() => line),
          borderColor: "#f3c15e",
          borderDash: [6, 4],

const VIP_TOKEN_KEY = "hba_vip_token";
let vipConfig = { supabase: false, access_codes_enabled: false };
let vipUnlocked = false;
let vipChatHistory = [];
let vipSlipImage = null;
let supabaseClient = null;

function vipToken() {
  return sessionStorage.getItem(VIP_TOKEN_KEY) || "";
}
function vipHeaders(json) {
  const h = {};
  if (json) h["Content-Type"] = "application/json";
  const tok = vipToken();
  if (tok) h["X-VIP-Token"] = tok;
  return h;
}
async function vipFetch(path, opts) {
  const options = opts || {};
  const headers = Object.assign({}, vipHeaders(Boolean(options.body)), options.headers || {});
  const res = await fetch(`${API_BASE}${path}`, Object.assign({}, options, { headers }));
  let data = null;
  try { data = await res.json(); } catch (e) { data = null; }
  return { res, data };
}
function openVip() {
  document.getElementById("vip-overlay").classList.remove("hidden");

}
function closeVip() {
  document.getElementById("vip-overlay").classList.add("hidden");
}

function applyVipAuthConfig(data) {
  vipConfig = Object.assign({}, data || vipConfig || {});
  if (!vipConfig.supabase_url || !vipConfig.supabase_anon_key) {
    vipConfig.supabase_url = SUPABASE_URL;
    vipConfig.supabase_anon_key = SUPABASE_ANON_KEY;
  }
  if (vipConfig.supabase_url && vipConfig.supabase_anon_key) {
    vipConfig.supabase = true;
  }
}
async function bootVip() {
  try {
    const { data } = await vipFetch("/api/vip/config");
    applyVipAuthConfig(data);
  } catch (e) {
    applyVipAuthConfig(null);
  }
  if (vipToken()) {
    const { res, data } = await vipFetch("/api/vip/me");
    if (res.ok && data && data.ok) {
      vipUnlocked = true;
      showVipApp();
      return;
    }
    if (res.status === 403) {
      vipUnlocked = false;
      renderVipGate("Tu cuenta aún no tiene acceso VIP.");
      return;
    }
    sessionStorage.removeItem(VIP_TOKEN_KEY);
  }
  try {
    const sb = await ensureSupabase();
    if (sb) {
      const { data } = await sb.auth.getSession();
      if (data && data.session) {
        await vipAfterSupabaseSession(data.session);
        return;
      }
    }
  } catch (e) {}
  vipUnlocked = false;
  renderVipGate();
}

function renderVipGate(msg) {
  document.getElementById("vip-app").classList.add("hidden");
  const disc = document.getElementById("vip-disclaimer");
  if (disc) disc.classList.add("hidden");
  const gate = document.getElementById("vip-gate");
  gate.classList.remove("hidden");
  const supabaseBlock = vipConfig.supabase ? `

      </div>
    ` : `<p class="vip-soon">Inicio de sesión con correo y contraseña: se activará cuando la cuenta de Supabase esté conectada.</p>`;
  gate.innerHTML = `
    <h3>Inicia sesión / acceso VIP</h3>

  `;
}

async function vipUnlockCode() {
  const code = (document.getElementById("vip-code") || {}).value || "";
  if (!code.trim()) return renderVipGate("Escribe un código de acceso.");
  sessionStorage.setItem(VIP_TOKEN_KEY, code.trim());
  const { res, data } = await vipFetch("/api/vip/me");
  if (res.ok && data && data.ok) {
    vipUnlocked = true;
    showVipApp();
    return;
  }
  sessionStorage.removeItem(VIP_TOKEN_KEY);
  renderVipGate((data && (data.detail || data.message)) || "Código inválido o VIP aún no está habilitado en el servidor.");
}

async function ensureSupabase() {
  if (supabaseClient) return supabaseClient;
  if (!vipConfig.supabase || !vipConfig.supabase_url || !vipConfig.supabase_anon_key) return null;
  if (!window.supabase) {
    await new Promise((resolve, reject) => {
      const s = document.createElement("script");
      s.src = "https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2";
      s.onload = resolve;
      s.onerror = reject;
      document.head.appendChild(s);
    });
  }
  supabaseClient = window.supabase.createClient(vipConfig.supabase_url, vipConfig.supabase_anon_key);
  return supabaseClient;
}
async function vipAfterSupabaseSession(session, fallback) {
  const token = session && session.access_token;
  if (!token) return renderVipGate(fallback || "No se pudo iniciar sesión.");
  sessionStorage.setItem(VIP_TOKEN_KEY, token);
  const { res, data } = await vipFetch("/api/vip/me");
  if (res.ok && data && data.ok) {
    vipUnlocked = true;
    showVipApp();
    return;
  }
  renderVipGate(res.status === 403 ? "Tu cuenta aún no tiene acceso VIP." : ((data && data.detail) || "No se pudo validar la sesión."));
}
async function vipEmailLogin() {
  try {
    const sb = await ensureSupabase();
    const email = document.getElementById("vip-email").value.trim();
    const password = document.getElementById("vip-pass").value;
    const { data, error } = await sb.auth.signInWithPassword({ email, password });
    if (error) return renderVipGate(error.message);
    await vipAfterSupabaseSession(data.session);
  } catch (e) { renderVipGate(e.message || "Error al iniciar sesión"); }
}
async function vipEmailSignup() {
  try {
    const sb = await ensureSupabase();
    const email = document.getElementById("vip-email").value.trim();
    const password = document.getElementById("vip-pass").value;
    const { data, error } = await sb.auth.signUp({ email, password, options: { emailRedirectTo: window.location.origin + window.location.pathname } });
    if (error) return renderVipGate(error.message);
    if (data.session) return vipAfterSupabaseSession(data.session);
    renderVipGate("Cuenta creada. Revisa tu correo si pide confirmación y luego inicia sesión. El acceso VIP lo activa el administrador.");
  } catch (e) { renderVipGate(e.message || "Error al crear la cuenta"); }
}

function histResultLabel(result) {
  const r = (result || "pendiente").toLowerCase();
  if (r === "ganado") return "Ganado";
  if (r === "perdido") return "Perdido";
  if (r === "nulo") return "Nulo";
  return "Pendiente";
}

function formatUnits(units) {
  if (units == null || units === "") return "";
  const n = Number(units);
  if (Number.isNaN(n)) return "";
  const sign = n > 0 ? "+" : "";
  return sign + n.toFixed(2) + " u";
}

function renderHistoryTab() {

async function loadVipHistory() {
  const status = document.getElementById("vip-history-status");
  const summaryEl = document.getElementById("vip-history-summary");
  const list = document.getElementById("vip-history-list");
  if (!status || !list) return;
  status.textContent = "Cargando el historial…";
  const { res, data } = await vipFetch("/api/vip/history");
  if (res.status === 401 || res.status === 403) return renderVipGate((data && data.detail) || "Se requiere acceso VIP.");
  if (!res.ok || !data || data.ok === false) {
    status.innerHTML = `<span class="err">${(data && (data.error || data.detail)) || "No se pudo cargar el historial."}</span>`;
    return;
  }
  const s = data.summary || {};
  const hit = s.hit_rate != null ? s.hit_rate + "%" : "–";
  const units = formatUnits(s.units) || "0.00 u";
  summaryEl.innerHTML = `
    <div class="hist-summary">
      <div class="hist-stat"><b>${s.total || 0}</b><span>Total</span></div>
      <div class="hist-stat"><b>${s.won || 0}</b><span>Ganados</span></div>
      <div class="hist-stat"><b>${s.lost || 0}</b><span>Perdidos</span></div>
      <div class="hist-stat"><b>${hit}</b><span>Acierto</span></div>
      <div class="hist-stat"><b>${units}</b><span>Unidades</span></div>
    </div>
  `;
  const days = data.days || [];
  if (!days.length) {
    status.textContent = "Aún no hay picks publicados en el historial.";
    list.innerHTML = "";
    return;
  }
  status.innerHTML = `<strong>Historial de picks</strong>`;
  list.innerHTML = days.map(day => {
    const ds = day.summary || {};
    const dayHit = ds.hit_rate != null ? " · " + ds.hit_rate + "%" : "";
    const dayUnits = formatUnits(ds.units);
    const headExtra = dayUnits ? " · " + dayUnits : "";
    const cards = (day.picks || []).map(p => {
      const result = (p.result || "pendiente").toLowerCase();
      const odd = p.odd != null ? p.odd : "";
      const line = p.line != null ? " " + p.line : "";
      const unitsLine = formatUnits(p.units);
      const sport = p.sport === "nba" ? "NBA" : (p.sport === "football" ? "Fútbol" : (p.sport || ""));
      const league = (p.league && p.league !== "NBA") ? p.league : "";
      return `
        <article class="vip-pick${p.maxima_confianza ? " maxima" : ""}">
          <div class="vip-pick-top">
            <div class="vip-rank">${sport}${p.maxima_confianza ? ' <span class="vip-maxima">Máxima confianza</span>' : ""}</div>
            <div class="hist-result ${result}">${histResultLabel(result)}</div>
          </div>
          <div class="vip-match">${p.match || p.entity || ""}</div>
          <div class="vip-meta">${[league, p.kickoff].filter(Boolean).join(" · ")}</div>
          <div class="vip-market"><strong>${p.market_label || p.market || ""}</strong> · ${p.selection || ""}${line}</div>
          <div class="vip-stats">
            ${odd !== "" ? `<div class="vip-stat"><span>Cuota</span><b>${odd}</b></div>` : ""}
            ${p.confidence != null ? `<div class="vip-stat"><span>Confianza</span><b>${p.confidence}/5</b></div>` : ""}
            ${p.actual_value != null && p.actual_value !== "" ? `<div class="vip-stat"><span>Final</span><b>${p.actual_value}</b></div>` : ""}
          </div>
          ${unitsLine ? `<div class="hist-units">${unitsLine}</div>` : ""}
        </article>
      `;
    }).join("");
    return `<div class="hist-day">${day.date}${dayHit}${headExtra}</div>${cards}`;
  }).join("");
}

function vipPicksStorageKey(sport, league) {
  return "hba_vip_picks_v9:" + sport + ":" + (league || "all");
}
function readLocalVipPicks(sport, league) {
  try {
    const item = JSON.parse(localStorage.getItem(vipPicksStorageKey(sport, league)) || "null");
    if (!item || !item.data || !item.ts) return null;
    if (Date.now() - item.ts > 12 * 3600 * 1000) return null;
    const today = new Date().toLocaleDateString("en-CA", { timeZone: "America/Bogota" });
    if (item.data.date && item.data.date !== today) return null;
    return item.data;
  } catch (e) { return null; }
}
function writeLocalVipPicks(sport, league, data) {
  try { localStorage.setItem(vipPicksStorageKey(sport, league), JSON.stringify({ ts: Date.now(), data: data })); } catch (e) {}
}
function paintVipPicksStatus(status, data) {
  const windowLabel = data.window === "upcoming" ? "Próxima jornada" : "Picks del día";
  status.innerHTML = `<strong>${windowLabel}</strong> · ${data.date}${data.frozen ? ' · <span class="vip-fixed">Tarjeta fija del día</span>' : ""}`;
}

function vipLevelLabel(p) {
  if (p.maxima_confianza) return { cls: "maxima", txt: "Máxima confianza" };
  const c = Number(p.confidence || 0);
  if (c >= 5) return { cls: "alta", txt: "Confianza muy alta" };
  if (c >= 4) return { cls: "alta", txt: "Confianza alta" };
  if (c >= 3) return { cls: "", txt: "Confianza media" };
  return { cls: "", txt: "Confianza baja" };
}
function vipTop3(picks) {
  const list = (picks || []).filter(Boolean);
  let top = list.filter(p => p.top3_rank).sort((a, b) => a.top3_rank - b.top3_rank);
  if (!top.length) {
    const score = p => Math.max(Number(p.edge) || 0, 0) * (Number(p.confidence) || 0) + (Number(p.model_prob) || 0) * 0.01 + (p.avg_odd != null ? 0.5 : 0);
    top = list.slice().sort((a, b) => score(b) - score(a) || (b.confidence || 0) - (a.confidence || 0));
  }
  return top.slice(0, 3);
}
function renderVipTop3(picks) {
  const top = vipTop3(picks);
  if (!top.length) return "";
  const maxCount = top.filter(p => p.maxima_confianza).length;
  const items = top.map((p, i) => {
    const lvl = vipLevelLabel(p);
    const hour = p.kickoff ? String(p.kickoff).slice(11, 16) : "";
    const meta = [p.sport === "nba" ? "NBA" : (p.league || "Fútbol"), hour, p.edge != null ? "Edge +" + p.edge + "%" : ""].filter(Boolean).join(" · ");
    return `
      <div class="top3-item${p.maxima_confianza ? " maxima" : ""}">
        <div class="top3-medal r${i + 1}">${i + 1}</div>
        <div class="top3-main">
          <div class="top3-match">${escapeHtml(p.match || p.entity || "")}</div>
          <div class="top3-market"><strong>${escapeHtml(p.market_label || p.market || "")}</strong> · ${escapeHtml(p.selection || "")}${p.line != null ? " " + p.line : ""}</div>
          <div class="top3-meta">${escapeHtml(meta)}</div>
          <span class="top3-level ${lvl.cls}">${lvl.txt}</span>${vipStatusBadge(p)}
        </div>
        <div class="top3-odd">${p.avg_odd != null ? `<b>${p.avg_odd}</b><span>Cuota</span>` : `<b>${p.hit_rate != null ? p.hit_rate + "%" : "–"}</b><span>Hit rate</span>`}</div>
      </div>`;
  }).join("");
  const note = maxCount >= 3 ? "Los 3 cumplen todos los filtros de Máxima confianza."
    : `${maxCount} de 3 con Máxima confianza hoy; el resto muestra su nivel real. Ordenados por valor (edge × confianza).`;
  return `
    <section class="top3">
      <div class="top3-head"><div class="top3-title">★ Top 3 del día</div><div class="top3-sub">Lo más sólido de HBA</div></div>
      ${items}
      <p class="top3-note">${note}</p>
    </section>`;
}
function vipStatusBadge(p) {
  const r = (p.result || "").toLowerCase();
  if (r === "ganado") return ' <span class="vip-status won">Ganado</span>';
  if (r === "perdido") return ' <span class="vip-status lost">Perdido</span>';
  if (r === "nulo") return ' <span class="vip-status">Nulo</span>';
  if (p.match_status === "en_juego") return ' <span class="vip-status live">En juego</span>';
  if (p.match_status === "finalizado") return ' <span class="vip-status">Finalizado</span>';
  return "";
}
function renderVipPickCards(picks) {
  return (picks || []).map(p => `
    <article class="vip-pick${p.maxima_confianza ? " maxima" : ""}">
      <div class="vip-pick-top">
        <div class="vip-rank">PICK ${p.rank}${p.maxima_confianza ? ' <span class="vip-maxima">Máxima confianza</span>' : ""}${vipStatusBadge(p)}</div>
        <div class="risk-${p.risk || "media"}">${(p.risk || "").toUpperCase()} riesgo</div>
      </div>
      <div class="vip-match">${p.match || p.entity || ""}</div>
      <div class="vip-meta">${[p.sport === "nba" ? "NBA" : (p.sport === "football" ? "Fútbol" : ""), (p.league && p.league !== "NBA") ? p.league : "", p.kickoff].filter(Boolean).join(" · ")}</div>
      <div class="vip-market"><strong>${p.market_label || p.market}</strong> · ${p.selection || ""}${p.line != null ? " " + p.line : ""}</div>
      ${p.line_label && p.line_estimated != null ? `<div class="vip-meta">${p.line_label}: ${p.line_estimated}${p.median != null ? " · mediana " + p.median : ""}${p.avg != null ? " · prom. " + p.avg : ""}</div>` : ""}
      ${p.book_line != null ? `<div class="vip-meta">${p.book_line_label || "Línea en casas"}: ${p.book_line}</div>` : ""}
      ${p.bet_name ? `<div class="vip-meta">Casas: ${p.bet_name}${p.odds_value ? " · " + p.odds_value : ""}</div>` : ""}
      <div class="vip-stats">
        <div class="vip-stat"><span>Hit rate</span><b>${p.hit_rate}%</b></div>
        <div class="vip-stat"><span>Muestra</span><b>${p.hits}/${p.games}</b></div>
        <div class="vip-stat"><span>Confianza</span><b>${p.confidence || "–"}/5</b></div>
        ${p.avg_minutes != null ? `<div class="vip-stat"><span>Minutos</span><b>${p.avg_minutes}</b></div>` : ""}
        ${p.avg_odd != null ? `<div class="vip-stat"><span>Cuota prom.</span><b>${p.avg_odd}</b></div>` : ""}
        ${p.odd_min != null && p.odd_max != null ? `<div class="vip-stat"><span>Rango</span><b>${p.odd_min}–${p.odd_max}</b></div>` : ""}
        ${p.bookmakers != null ? `<div class="vip-stat"><span>Casas</span><b>${p.bookmakers}</b></div>` : ""}
        ${p.edge != null ? `<div class="vip-stat"><span>Edge</span><b>${p.edge > 0 ? "+" : ""}${p.edge}%</b></div>` : ""}
      </div>
      <p class="vip-reason">${p.reason || ""}</p>
    </article>
  `).join("");
}

async function loadVipPicks() {
  const status = document.getElementById("vip-picks-status");
  const list = document.getElementById("vip-picks-list");
  if (!status || !list) return;
  const sport = document.getElementById("vip-sport").value;
  const league = document.getElementById("vip-league").value;
  const localCached = readLocalVipPicks(sport, league);
  if (localCached && (localCached.picks || []).length) {
    list.innerHTML = renderVipTop3(localCached.picks) + renderVipPickCards(localCached.picks);
    paintVipPicksStatus(status, localCached);
  } else {
    status.textContent = "Calculando picks con las estadísticas de HBA…";
    list.innerHTML = "";
  }
  let path = `/api/vip/picks?sport=${encodeURIComponent(sport)}`;
  if (sport === "football" && league) path += `&league=${encodeURIComponent(league)}`;
  const { res, data } = await vipFetch(path);
  if (res.status === 401 || res.status === 403) {
    renderVipGate((data && data.detail) || "Se requiere acceso VIP.");
    return;
  }
  if (!res.ok) {
    status.innerHTML = `<span class="err">${(data && (data.detail || data.message)) || "No se pudieron calcular los picks."}</span>`;
    return;
  }
  paintVipPicksStatus(status, data);
  writeLocalVipPicks(sport, league, data);
  if (!data.picks || !data.picks.length) {
    list.innerHTML = `<p class="hint">${data.empty_reason || "No hay picks con muestra suficiente para esta pizarra."}</p>`;
    return;
  }
  list.innerHTML = renderVipTop3(data.picks) + renderVipPickCards(data.picks);

}

  if (el.dataset.ready) return;
  el.innerHTML = `
    <p class="hint" style="margin:12px 0 8px">Escribe tus picks (una por línea) o sube una captura de la boleta. Las estadísticas las calcula HBA.</p>
    <textarea id="vip-slip-text" rows="5" placeholder="Ejemplo:&#10;Millonarios gana&#10;Ambos anotan Sí&#10;Over 9.5 corners"></textarea>
    <label class="hint vip-file">Subir captura de la boleta<br><input id="vip-slip-file" type="file" accept="image/*" onchange="onVipSlipFile(event)"></label>
    <button type="button" class="btn" onclick="analyzeVipSlip()">Analizar apuesta</button>
    <p id="vip-slip-status" class="hint"></p>
    <div id="vip-slip-out"></div>
  `;
  el.dataset.ready = "1";
}
function onVipSlipFile(ev) {
  const file = ev.target.files && ev.target.files[0];
  vipSlipImage = null;
  if (!file) return;
  const reader = new FileReader();
  reader.onload = () => { vipSlipImage = reader.result; };
  reader.readAsDataURL(file);
}
async function analyzeVipSlip() {
  const status = document.getElementById("vip-slip-status");
  const out = document.getElementById("vip-slip-out");
  status.textContent = "Analizando tu apuesta con las estadísticas de HBA…";
  out.innerHTML = "";
  const body = { text: (document.getElementById("vip-slip-text").value || "").trim() || null };
  if (vipSlipImage) {
    body.image_base64 = vipSlipImage;
    body.image_mime = (vipSlipImage.split(";")[0] || "data:image/jpeg").replace("data:", "");
  }
  const { res, data } = await vipFetch("/api/vip/slip", { method: "POST", body: JSON.stringify(body) });
  if (res.status === 401 || res.status === 403) return renderVipGate((data && data.detail) || "Se requiere acceso VIP.");
  if (!res.ok || (data && data.ok === false && !(data.picks || []).length)) {
    status.innerHTML = `<span class="err">${(data && (data.error || data.detail)) || "No se pudo analizar."}</span>`;
    return;
  }
  status.textContent = data.source === "image" ? "Lectura de la captura lista." : "Análisis listo.";
  const parlay = data.parlay ? `
    <div class="vip-parlay">
      <strong>Parlay (estimación)</strong>
      <div class="kpi"><div><div class="lbl">Producto de hit rates</div><div class="num" style="font-size:2rem">${data.parlay.combined_hit_rate}%</div></div></div>
      <p class="hint">${data.parlay.label}</p>
    </div>` : "";
  out.innerHTML = parlay + (data.picks || []).map(p => {
    const ent = (p.entity && (p.entity.name || "")) || p.query || p.raw || "";
    const swaps = (p.swaps || []).map(s => `<div class="hint">Cambio sugerido: <strong>${s.market_label}</strong> ${s.selection || ""} · ${s.hit_rate}% (${s.games} PJ)</div>`).join("");
    return `<article class="vip-pick">
      <div class="vip-pick-top"><div class="vip-match">${ent}</div><span class="verdict ${p.verdict || "weak"}">${p.verdict === "strong" ? "Fuerte" : p.verdict === "mixed" ? "Media" : "Débil"}</span></div>
      <div class="vip-meta">${p.raw || ""}</div>
      <div class="vip-market">${p.market_label || p.requested_market || ""} · ${p.selection || ""}${p.line != null && p.line !== "yes" && p.line !== "no" ? " " + p.line : ""}</div>
      <div class="vip-stats">
        <div class="vip-stat"><span>Hit rate</span><b>${p.hit_rate != null ? p.hit_rate + "%" : "–"}</b></div>
        <div class="vip-stat"><span>Muestra</span><b>${p.games ? (p.hits + "/" + p.games) : "–"}</b></div>
      </div>
      ${p.detail ? `<p class="hint">${p.detail}</p>` : ""}
      ${swaps}
    </article>`;
  }).join("");
}

const VIP_CHAT_STORE = "hba_vip_chat_v2";
const VIP_CHAT_SUGGESTIONS = [
  "¿Cuáles son los picks más sólidos de hoy?",
  "Hit rate de córners del Real Madrid en sus últimos 15",
  "¿Luka Doncic pasa de 32.5 puntos esta noche?",
  "Forma reciente de Millonarios y su próximo rival",
];
let vipChatBusy = false;
(function loadChatStore() {
  try {
    const saved = JSON.parse(localStorage.getItem(VIP_CHAT_STORE) || "[]");
    if (Array.isArray(saved)) vipChatHistory = saved.filter(m => m && m.role && typeof m.content === "string").slice(-40);
  } catch (e) {}
})();
function saveVipChat() {
  try { localStorage.setItem(VIP_CHAT_STORE, JSON.stringify(vipChatHistory.filter(m => !m.error).slice(-40))); } catch (e) {}
}
function chatTime(ts) {
  const d = ts ? new Date(ts) : new Date();
  return d.toLocaleTimeString("es-CO", { hour: "numeric", minute: "2-digit" });
}
function mdInline(t) {
  return t
    .replace(/`([^`]+)`/g, "<code>$1</code>")
    .replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>")
    .replace(/(^|[^*])\*([^*\n]+)\*/g, "$1<em>$2</em>")
    .replace(/\[([^\]]+)\]\((https?:\/\/[^\s)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
}
function renderMarkdown(src) {
  const lines = escapeHtml(src).replace(/\r/g, "").split("\n");
  let html = "", list = null, para = [];
  const flushPara = () => { if (para.length) { html += "<p>" + mdInline(para.join("<br>")) + "</p>"; para = []; } };
  const closeList = () => { if (list) { html += `</${list}>`; list = null; } };
  for (const raw of lines) {
    const line = raw.trimEnd();
    let m;
    if (!line.trim()) { flushPara(); closeList(); continue; }
    if ((m = line.match(/^\s*#{1,6}\s+(.*)$/))) { flushPara(); closeList(); html += "<h4>" + mdInline(m[1]) + "</h4>"; continue; }
    if ((m = line.match(/^\s*[-*•]\s+(.*)$/))) { flushPara(); if (list !== "ul") { closeList(); html += "<ul>"; list = "ul"; } html += "<li>" + mdInline(m[1]) + "</li>"; continue; }
    if ((m = line.match(/^\s*\d+[.)]\s+(.*)$/))) { flushPara(); if (list !== "ol") { closeList(); html += "<ol>"; list = "ol"; } html += "<li>" + mdInline(m[1]) + "</li>"; continue; }
    closeList(); para.push(line);
  }
  flushPara(); closeList();
  return html;
}
function renderChatTab() {
  const el = document.getElementById("vip-tab-chat");
  if (el.dataset.ready) { paintVipChat(); return; }
  el.innerHTML = `
    <div class="ai-chat">
      <div class="ai-chat-head">
        <div class="ai-avatar">H</div>
        <div class="ai-head-txt">
          <div class="ai-head-name">HBA AI</div>
          <div class="ai-head-status"><span class="ai-dot-online"></span>En línea · fútbol y NBA</div>
        </div>
        <button type="button" class="ai-new" onclick="newVipChat()">+ Nuevo chat</button>
      </div>
      <div id="vip-chatlog" class="ai-log" aria-live="polite"></div>
      <div class="ai-composer">
        <div class="ai-inputbox">
          <textarea id="vip-chat-input" class="ai-input" rows="1" placeholder="Pregúntale a HBA AI…" enterkeyhint="send"></textarea>
          <button type="button" id="vip-chat-send" class="ai-send" onclick="sendVipChat()" aria-label="Enviar" disabled>
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5"/><path d="M5 12l7-7 7 7"/></svg>
          </button>
        </div>
        <div class="ai-hint">HBA AI usa estadísticas reales, pero puede equivocarse. +18.</div>
      </div>
    </div>
  `;
  el.dataset.ready = "1";
  const input = document.getElementById("vip-chat-input");
  const send = document.getElementById("vip-chat-send");
  const grow = () => {
    input.style.height = "auto";
    input.style.height = Math.min(input.scrollHeight, 140) + "px";
    send.disabled = vipChatBusy || !input.value.trim();
  };
  input.addEventListener("input", grow);
  input.addEventListener("keydown", ev => {
    const touch = window.matchMedia && window.matchMedia("(pointer: coarse)").matches;
    if (ev.key === "Enter" && !ev.shiftKey && !touch) { ev.preventDefault(); sendVipChat(); }
  });
  paintVipChat();
}
function vipChatRow(m, idx) {
  if (m.role === "user") {
    return `<div class="ai-row user"><div class="ai-col"><div class="ai-msg">${escapeHtml(m.content)}</div><div class="ai-time">${chatTime(m.ts)}</div></div></div>`;
  }
  const err = m.error ? " error" : "";
  const tools = m.error
    ? `<button type="button" class="ai-retry" onclick="retryVipChat()">Reintentar</button>`
    : `<button type="button" class="ai-copy" onclick="copyVipChat(${idx})">Copiar</button>`;
  return `<div class="ai-row assistant${err}"><div class="ai-avatar">H</div><div class="ai-col"><div class="ai-msg" data-idx="${idx}">${renderMarkdown(m.content)}</div><div class="ai-time">HBA AI · ${chatTime(m.ts)} ${tools}</div></div></div>`;
}
function vipChatNearBottom(log) {
  return log.scrollHeight - log.scrollTop - log.clientHeight < 120;
}
function scrollVipChat(force) {
  const log = document.getElementById("vip-chatlog");
  if (!log) return;
  if (force) { log.style.scrollBehavior = "auto"; log.scrollTop = log.scrollHeight; log.style.scrollBehavior = ""; return; }
  if (vipChatNearBottom(log)) log.scrollTop = log.scrollHeight;
}
function paintVipChat(opts) {
  const log = document.getElementById("vip-chatlog");
  if (!log) return;
  opts = opts || {};
  if (!vipChatHistory.length && !opts.typing) {
    log.innerHTML = `
      <div class="ai-empty">
        <div class="ai-avatar lg">H</div>
        <h3>¿Qué analizamos hoy?</h3>
        <p>Soy HBA AI. Consulto estadísticas reales de equipos y jugadores antes de responderte.</p>
        <div class="ai-chips">${VIP_CHAT_SUGGESTIONS.map(q => `<button type="button" class="ai-chip" onclick="askVipChat(this.textContent)">${escapeHtml(q)}</button>`).join("")}</div>
      </div>`;
    return;
  }
  let html = vipChatHistory.map((m, i) => vipChatRow(m, i)).join("");
  if (opts.typing) html += `<div class="ai-row assistant" id="ai-typing-row"><div class="ai-avatar">H</div><div class="ai-col"><div class="ai-msg ai-typing"><i></i><i></i><i></i></div></div></div>`;
  log.innerHTML = html;
  scrollVipChat(true);
}
function askVipChat(text) {
  const input = document.getElementById("vip-chat-input");
  if (!input) return;
  input.value = text;
  sendVipChat();
}
function newVipChat() {
  if (vipChatBusy) return;
  vipChatHistory = [];
  saveVipChat();
  paintVipChat();
  const input = document.getElementById("vip-chat-input");
  if (input) input.focus();
}
function copyVipChat(idx) {
  const m = vipChatHistory[idx];
  if (!m) return;
  try { navigator.clipboard.writeText(m.content); } catch (e) {}
}
function retryVipChat() {
  if (vipChatBusy) return;
  while (vipChatHistory.length && vipChatHistory[vipChatHistory.length - 1].error) vipChatHistory.pop();
  const last = vipChatHistory[vipChatHistory.length - 1];
  if (!last || last.role !== "user") return paintVipChat();
  requestVipChat();
}
function typewriteVipChat(idx) {
  return new Promise(resolve => {
    const m = vipChatHistory[idx];
    const box = document.querySelector(`#vip-chatlog .ai-msg[data-idx="${idx}"]`);
    if (!m || !box) return resolve();
    const full = m.content;
    const total = full.length;
    const duration = Math.min(2200, Math.max(500, total * 9));
    const start = performance.now();
    const step = now => {
      const n = Math.min(total, Math.ceil(total * (now - start) / duration));
      box.innerHTML = renderMarkdown(full.slice(0, n)) + (n < total ? '<span class="ai-caret"></span>' : "");
      scrollVipChat(false);
      if (n < total) requestAnimationFrame(step); else resolve();
    };
    requestAnimationFrame(step);
  });
}
function setVipChatBusy(busy) {
  vipChatBusy = busy;
  const input = document.getElementById("vip-chat-input");
  const send = document.getElementById("vip-chat-send");
  if (send) send.disabled = busy || !(input && input.value.trim());
}
async function requestVipChat() {
  setVipChatBusy(true);
  paintVipChat({ typing: true });
  const payload = { messages: vipChatHistory.filter(m => !m.error).slice(-12).map(m => ({ role: m.role, content: m.content })) };
  let res, data;
  try {
    ({ res, data } = await vipFetch("/api/vip/chat", { method: "POST", body: JSON.stringify(payload) }));
  } catch (e) {
    res = { ok: false, status: 0 }; data = null;
  }
  if (res.status === 401 || res.status === 403) { setVipChatBusy(false); return renderVipGate((data && data.detail) || "Se requiere acceso VIP."); }
  if (!res.ok || !data || !data.ok) {
    vipChatHistory.push({ role: "assistant", error: true, ts: Date.now(), content: (data && (data.error || data.detail)) || "No pude completar la respuesta. Revisa tu conexión e inténtalo de nuevo." });
    paintVipChat();
    setVipChatBusy(false);
    return;
  }
  vipChatHistory.push({ role: "assistant", content: data.message || "", ts: Date.now() });
  const idx = vipChatHistory.length - 1;
  paintVipChat();
  await typewriteVipChat(idx);
  saveVipChat();
  setVipChatBusy(false);
}
async function sendVipChat() {
  const input = document.getElementById("vip-chat-input");
  if (!input || vipChatBusy) return;
  const text = (input.value || "").trim();
  if (!text) return;
  while (vipChatHistory.length && vipChatHistory[vipChatHistory.length - 1].error) vipChatHistory.pop();
  vipChatHistory.push({ role: "user", content: text, ts: Date.now() });
  saveVipChat();
  input.value = "";
  input.style.height = "auto";
  await requestVipChat();
}

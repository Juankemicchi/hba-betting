<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Betting</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #070b14;
      color: #e5e7eb;
    }
    .header {
      background: #0f172a;
      padding: 14px 28px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1e293b;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: 700;
      color: #fbbf24;
    }
    .sports {
      display: flex;
      gap: 8px;
    }
    .sport-btn {
      background: #1e293b;
      border: none;
      color: white;
      padding: 8px 16px;
      border-radius: 999px;
      cursor: pointer;
      font-size: 0.9rem;
    }
    .sport-btn.active {
      background: #3b82f6;
    }
    .vip-btn {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      color: #0f172a;
      border: none;
      padding: 8px 16px;
      border-radius: 999px;
      font-weight: 700;
      font-size: 0.9rem;
      cursor: pointer;
    }
    .container {
      max-width: 1200px;
      margin: 24px auto;
      padding: 0 20px;
    }
    .card {
      background: #0f172a;
      border-radius: 16px;
      padding: 24px;
      border: 1px solid #1e293b;
    }
    .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      margin: 16px 0 20px;
    }
    input, select {
      padding: 10px 12px;
      border-radius: 8px;
      border: 1px solid #334155;
      background: #1e293b;
      color: white;
    }
    .analyze-btn {
      background: #10b981;
      border: none;
      padding: 10px 22px;
      border-radius: 8px;
      font-weight: 700;
      color: white;
      cursor: pointer;
    }
    .dashboard {
      display: grid;
      grid-template-columns: 1fr 300px;
      gap: 18px;
      margin-top: 10px;
    }
    .metrics-row {
      display: flex;
      gap: 12px;
      margin-bottom: 16px;
    }
    .metric {
      background: #1e293b;
      padding: 14px 18px;
      border-radius: 12px;
      flex: 1;
      text-align: center;
    }
    .metric span {
      display: block;
      font-size: 1.7rem;
      font-weight: 700;
      color: #10b981;
    }
    .analysis {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
      margin-bottom: 16px;
      border-left: 3px solid #fbbf24;
      line-height: 1.5;
    }
    .chart-box {
      background: #1e293b;
      border-radius: 12px;
      padding: 12px;
    }
    .side-panel {
      background: #1e293b;
      border-radius: 12px;
      padding: 16px;
    }
    .support {
      margin-top: 28px;
      text-align: center;
      color: #94a3b8;
      font-size: 0.85rem;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">HBA BETTING</div>
    <div class="sports">
      <button class="sport-btn active">NBA</button>
      <button class="sport-btn">Fútbol</button>
      <button class="sport-btn">Tenis</button>
      <button class="sport-btn">E-Sports</button>
    </div>
    <button class="vip-btn">VIP AI Assistant</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>NBA Player Props</h2>
      
      <div class="controls">
        <input type="text" id="player" placeholder="Jugador" value="Luka Doncic">
        <select id="prop">
          <option value="PTS">Puntos</option>
          <option value="REB">Rebotes</option>
          <option value="AST">Asistencias</option>
          <option value="PRA">PRA</option>
          <option value="PR">PR</option>
          <option value="PA">PA</option>
          <option value="RA">RA</option>
          <option value="FG3M">Triples</option>
          <option value="MIN">Minutos</option>
          <option value="DD">Double-Double</option>
          <option value="TD">Triple-Double</option>
        </select>
        <select id="line"></select>
        <button class="analyze-btn" onclick="analyze()">Analizar</button>
      </div>

      <div id="result"></div>
    </div>

    <div class="support">
      Soporte: <b>soporte@hbabetting.com</b>
    </div>
  </div>

  <script>
    const lineSelect = document.getElementById('line');
    for (let i = 0; i < 100; i++) {
      const val = (i + 0.5).toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.text = val;
      if (val === "25.5") opt.selected = true;
      lineSelect.appendChild(opt);
    }

    let chartInstance = null;

    async function analyze() {
      const player = document.getElementById('player').value.trim();
      const prop = document.getElementById('prop').value;
      const line = parseFloat(document.getElementById('line').value);
      const resultDiv = document.getElementById('result');

      resultDiv.innerHTML = "<p>Analizando...</p>";

      try {
        const response = await fetch("https://hba-backend.onrender.com/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ player, prop, line, last_n: 12 })
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<p style="color:#ef4444">${data.detail}</p>`;
          return;
        }

        const s = data.stats;
        const games = data.games || [];
        const aiText = data.ai_analysis || "No se pudo generar análisis.";

        resultDiv.innerHTML = `
          <div class="dashboard">
            <div>
              <div class="metrics-row">
                <div class="metric">Promedio <span>${s.avg}</span></div>
                <div class="metric">Hit Rate <span>${s.hit_rate}%</span></div>
                <div class="metric">Partidos <span>${s.games}</span></div>
              </div>
              <div class="analysis">
                <strong>Análisis del Pick</strong><br>
                ${aiText}
              </div>
              <div class="chart-box">
                <canvas id="chart"></canvas>
              </div>
            </div>
            <div class="side-panel">
              <h4 style="margin-bottom:10px;">Resumen</h4>
              <p style="font-size:0.9rem; color:#94a3b8;">Línea: <b>${s.line}</b></p>
              <p style="font-size:0.9rem; color:#94a3b8; margin-top:6px;">Prop: <b>${s.prop}</b></p>
              <p style="margin-top:14px; font-size:0.85rem;">Verde = Superó la línea<br>Rojo = No la superó</p>
            </div>
          </div>
        `;

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('chart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: games.map((_, i) => `J${i+1}`),
            datasets: [{
              data: games.map(g => g[s.value_col] || 0),
              backgroundColor: games.map(g => g.Over ? '#10b981' : '#ef4444')
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: '#334155' } },
              x: { grid: { display: false } }
            }
          }
        });

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:#ef4444">Error de conexión.</p>`;
      }
    }
  </script>

</body>
</html>

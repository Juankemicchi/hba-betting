<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Betting</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: #0a0e1a;
      color: white;
    }
    .header {
      background: #111827;
      padding: 15px 30px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      border-bottom: 1px solid #1f2937;
    }
    .logo {
      font-size: 1.6rem;
      font-weight: bold;
      color: #fbbf24;
    }
    .sports {
      display: flex;
      gap: 10px;
    }
    .sport-btn {
      background: #1f2937;
      border: none;
      color: white;
      padding: 10px 20px;
      border-radius: 50px;
      cursor: pointer;
      font-weight: 500;
    }
    .sport-btn.active {
      background: #3b82f6;
    }
    .vip-btn {
      background: linear-gradient(90deg, #fbbf24, #f59e0b);
      color: black;
      border: none;
      padding: 10px 20px;
      border-radius: 50px;
      font-weight: bold;
      cursor: pointer;
    }
    .container {
      max-width: 1200px;
      margin: 30px auto;
      padding: 0 20px;
    }
    .card {
      background: #111827;
      border-radius: 16px;
      padding: 25px;
      border: 1px solid #1f2937;
    }
    input, select, button {
      padding: 12px;
      border-radius: 8px;
      border: 1px solid #374151;
      background: #1f2937;
      color: white;
      margin: 5px;
    }
    .analyze-btn {
      background: #10b981;
      border: none;
      padding: 12px 25px;
      border-radius: 8px;
      font-weight: bold;
      cursor: pointer;
    }
    #result {
      margin-top: 25px;
    }
    .metric {
      display: inline-block;
      background: #1f2937;
      padding: 15px 25px;
      border-radius: 12px;
      margin: 10px;
      text-align: center;
    }
    .metric span {
      display: block;
      font-size: 1.8rem;
      font-weight: bold;
      color: #10b981;
    }
  </style>
</head>
<body>

  <div class="header">
    <div class="logo">HBA BETTING</div>
    <div class="sports">
      <button class="sport-btn active">NBA</button>
      <button class="sport-btn">Fútbol</button>
      <button class="sport-btn">Tenis</button>
      <button class="sport-btn">E-Sports</button>
    </div>
    <button class="vip-btn">VIP AI Assistant</button>
  </div>

  <div class="container">
    <div class="card">
      <h2>NBA Player Props Analyzer</h2>
      <br>
      
      <input type="text" id="player" placeholder="Nombre del jugador" value="Jalen Brunson">
      
      <select id="prop">
        <option value="PTS">Puntos</option>
        <option value="REB">Rebotes</option>
        <option value="AST">Asistencias</option>
        <option value="PRA">Puntos + Rebotes + Asistencias</option>
        <option value="PR">Puntos + Rebotes</option>
        <option value="PA">Puntos + Asistencias</option>
        <option value="RA">Rebotes + Asistencias</option>
        <option value="FG3M">Triples</option>
        <option value="MIN">Minutos</option>
        <option value="DD">Double-Double</option>
        <option value="TD">Triple-Double</option>
      </select>
      
      <select id="line">
        <!-- Se llena con JavaScript -->
      </select>
      
      <button class="analyze-btn" onclick="analyze()">Analizar</button>

      <div id="result"></div>
    </div>
  </div>

  <script>
    // Llenar líneas .5
    const lineSelect = document.getElementById('line');
    for (let i = 0; i < 100; i++) {
      const val = (i + 0.5).toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.text = val;
      if (val === "20.5") opt.selected = true;
      lineSelect.appendChild(opt);
    }

    async function analyze() {
      const player = document.getElementById('player').value;
      const prop = document.getElementById('prop').value;
      const line = parseFloat(document.getElementById('line').value);
      const resultDiv = document.getElementById('result');

      resultDiv.innerHTML = "<p>Analizando...</p>";

      try {
        const response = await fetch("https://hba-backend.onrender.com/analyze", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({
            player: player,
            prop: prop,
            line: line,
            last_n: 12
          })
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<p style="color:red">${data.detail}</p>`;
          return;
        }

        const s = data.stats;
        resultDiv.innerHTML = `
          <h3>${s.player}</h3>
          <div class="metric">Promedio <span>${s.avg}</span></div>
          <div class="metric">Hit Rate <span>${s.hit_rate}%</span></div>
          <div class="metric">Partidos <span>${s.games}</span></div>
          <p style="margin-top:15px; color:#9ca3af;">
            Superó la línea de <b>${s.line}</b> en ${Math.round(s.hit_rate * s.games / 100)} de ${s.games} partidos.
          </p>
        `;
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:red">Error de conexión. Intenta de nuevo.</p>`;
      }
    }
  </script>

</body>
</html>

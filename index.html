<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Sports Intelligence</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>■</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #080c16;
      --bg2: #0c1220;
      --card: #121a2b;
      --card2: #172136;
      --border: #243049;
      --text: #e8eefc;
      --muted: #8b9bb8;
      --gold: #f3c15e;
      --green: #2ee59d;
      --red: #ff4d6a;
      --blue: #5b8cff;
      --shadow: 0 10px 30px rgba(0,0,0,.35);
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { font-family: Inter, "Segoe UI", system-ui, sans-serif; background: radial-gradient(1200px 500px at 10% -10%, #15203a 0%, var(--bg) 55%); color: var(--text); min-height: 100vh; }
    button, input, select { font-family: inherit; }
    .topbar { display: flex; align-items: center; justify-content: space-between; gap: 16px; padding: 14px 28px; border-bottom: 1px solid var(--border); background: rgba(8,12,22,.9); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 20; }
    .brand { display: flex; align-items: center; gap: 10px; }
    .mark { width: 34px; height: 34px; border-radius: 10px; background: linear-gradient(135deg, #f3c15e, #c9922d); color: #1a1305; display: grid; place-items: center; font-weight: 800; letter-spacing: -.04em; }
    .brand-name { font-weight: 800; letter-spacing: .12em; font-size: 1.05rem; }
    .brand-sub { font-size: .68rem; color: var(--muted); letter-spacing: .16em; text-transform: uppercase; }
    nav { display: flex; gap: 6px; flex-wrap: wrap; }
    .tab { background: transparent; border: 1px solid transparent; color: var(--muted); padding: 8px 14px; border-radius: 999px; cursor: pointer; font-weight: 600; font-size: .9rem; }
    .tab:hover { color: var(--text); }
    .tab.active { background: #1a2742; color: var(--text); border-color: var(--border); }
    .tab.disabled { opacity: .45; cursor: not-allowed; }
    .tab small { display: block; font-size: .62rem; font-weight: 500; letter-spacing: .04em; }
    main { max-width: 1280px; margin: 0 auto; padding: 24px 20px 48px; }
    .search-wrap { position: relative; max-width: 760px; margin: 0 auto 18px; }
    .search-wrap input { width: 100%; background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 16px; padding: 16px 18px 16px 46px; font-size: 1rem; outline: none; }
    .search-wrap input:focus { border-color: var(--gold); }
    .search-icon { position: absolute; left: 16px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    .suggest { position: absolute; left: 0; right: 0; top: calc(100% + 6px); background: var(--card); border: 1px solid var(--border); border-radius: 14px; box-shadow: var(--shadow); max-height: 380px; overflow: auto; display: none; z-index: 30; }
    .suggest.open { display: block; }
    .sg-sec { padding: 8px 12px 4px; font-size: .7rem; color: var(--muted); letter-spacing: .08em; text-transform: uppercase; }
    .sg-item { display: flex; align-items: center; gap: 10px; padding: 10px 14px; cursor: pointer; }
    .sg-item:hover { background: var(--card2); }
    .sg-item img { width: 28px; height: 28px; object-fit: contain; border-radius: 50%; background: #0b1020; }
    .chips { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 22px; }
    .chip { background: var(--card); border: 1px solid var(--border); color: var(--muted); padding: 6px 12px; border-radius: 999px; cursor: pointer; font-size: .82rem; }
    .chip.active { color: #1a1305; background: var(--gold); border-color: var(--gold); font-weight: 700; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(148px, 1fr)); gap: 12px; }
    .team-card { background: var(--card); border: 1px solid var(--border); border-radius: 14px; padding: 16px 10px; text-align: center; cursor: pointer; }
    .team-card:hover, .team-card.active { border-color: var(--gold); }
    .team-card img { width: 58px; height: 58px; object-fit: contain; margin-bottom: 8px; }
    .team-card strong { display: block; font-size: .86rem; }
    .team-card span { display: block; color: var(--muted); font-size: .72rem; margin-top: 4px; }
    .toolbar { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 16px; }
    .toolbar input, .toolbar select { background: var(--card); border: 1px solid var(--border); color: var(--text); border-radius: 10px; padding: 9px 10px; }
    .seg { display: flex; background: var(--card); border: 1px solid var(--border); border-radius: 10px; overflow: hidden; }
    .seg button { background: transparent; border: 0; color: var(--muted); padding: 8px 12px; cursor: pointer; font-weight: 600; font-size: .82rem; }
    .seg button.active { background: #1e2d4d; color: var(--text); }
    .btn { background: var(--gold); border: 0; color: #1a1305; font-weight: 800; padding: 9px 16px; border-radius: 10px; cursor: pointer; }
    .btn:hover { filter: brightness(1.05); }
    .hint { color: var(--muted); font-size: .85rem; }
    .err { color: var(--red); font-size: .9rem; }
    .dash { display: grid; grid-template-columns: minmax(0, 1.4fr) 320px; gap: 16px; }
    .col { display: flex; flex-direction: column; gap: 16px; min-width: 0; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 16px 18px; box-shadow: var(--shadow); }
    .kpi { display: flex; align-items: flex-end; justify-content: space-between; gap: 12px; }
    .kpi .num { font-size: 3rem; font-weight: 800; letter-spacing: -.04em; line-height: .9; }
    .kpi .lbl { color: var(--muted); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 6px; }
    .trend { font-weight: 700; font-size: .9rem; }
    .trend.up { color: var(--green); } .trend.down { color: var(--red); }
    .chart-box { height: 220px; }
    .spot { text-align: center; }
    .spot img, .spot .crest { width: 86px; height: 86px; object-fit: cover; border-radius: 50%; background: #0b1020; margin-bottom: 8px; border: 2px solid var(--border); }
    .spot .crest { object-fit: contain; border-radius: 16px; padding: 6px; }
    .spot h2 { font-size: 1.15rem; margin: 4px 0; }
    .gauge-wrap { display: grid; place-items: center; margin: 12px 0; }
    .gauge { width: 132px; height: 132px; border-radius: 50%; display: grid; place-items: center; position: relative; }
    .gauge::after { content: ""; position: absolute; inset: 14px; background: var(--card); border-radius: 50%; }
    .gauge span { position: relative; z-index: 1; font-weight: 800; font-size: 1.35rem; }
    .stars { color: var(--gold); letter-spacing: 2px; margin: 6px 0; }
    .lean { display: inline-block; margin-top: 8px; padding: 6px 10px; border-radius: 8px; font-weight: 800; font-size: .78rem; letter-spacing: .06em; }
    .lean.OVER { background: rgba(46,229,157,.12); color: var(--green); }
    .lean.UNDER { background: rgba(255,77,106,.12); color: var(--red); }
    .lean.NEUTRAL { background: #1e2d4d; color: var(--muted); }
    .rows { display: flex; flex-direction: column; gap: 6px; }
    .prop { display: grid; grid-template-columns: minmax(110px,1.3fr) 78px 96px 58px 72px; gap: 8px; align-items: center; padding: 8px 8px; border-radius: 10px; cursor: pointer; border: 1px solid transparent; }
    .prop:hover, .prop.active { background: var(--card2); border-color: var(--border); }
    .prop .name { font-size: .85rem; }
    .prop .avg, .prop .line, .prop .pct { font-size: .8rem; color: var(--muted); text-align: right; font-variant-numeric: tabular-nums; }
    .prop .pct.hot { color: var(--green); font-weight: 700; }
    .prop .pct.cold { color: var(--red); font-weight: 700; }
    .prop input { width: 64px; background: #0b1020; border: 1px solid var(--border); color: var(--text); border-radius: 8px; padding: 4px 6px; }
    .step { display: inline-flex; align-items: center; border: 1px solid var(--border); border-radius: 8px; overflow: hidden; background: #0b1020; }
    .step button { width: 22px; height: 26px; border: 0; background: transparent; color: var(--text); cursor: pointer; font-size: .95rem; }
    .step button:hover { background: #1e2d4d; }
    .step span { min-width: 34px; text-align: center; font-size: .8rem; font-variant-numeric: tabular-nums; }
    .seg.yesno button { padding: 5px 10px; font-size: .78rem; }
    .lean.SI { background: rgba(46,229,157,.12); color: var(--green); }
    .lean.NO { background: rgba(255,77,106,.12); color: var(--red); }
    table { width: 100%; border-collapse: collapse; font-size: .82rem; }
    th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
    th { color: var(--muted); font-weight: 600; font-size: .72rem; letter-spacing: .06em; text-transform: uppercase; }
    .pill { padding: 2px 7px; border-radius: 999px; font-weight: 800; font-size: .7rem; }
    .pill.hit { background: rgba(46,229,157,.15); color: var(--green); }
    .pill.miss { background: rgba(255,77,106,.15); color: var(--red); }
    .ai p { line-height: 1.55; font-size: .92rem; color: #d5def0; white-space: pre-wrap; }
    .ai h3 { color: var(--gold); font-size: .78rem; letter-spacing: .1em; text-transform: uppercase; margin-bottom: 8px; }
    .squad { display: grid; grid-template-columns: repeat(auto-fill, minmax(72px, 1fr)); gap: 10px; }
    .squad-item { min-width: 88px; text-align: center; cursor: pointer; }
    .squad-item img { width: 52px; height: 52px; border-radius: 50%; object-fit: cover; background: #0b1020; }
    .squad-item div { font-size: .7rem; margin-top: 4px; color: var(--muted); }
    .footer { max-width: 1280px; margin: 0 auto; padding: 10px 20px 28px; color: var(--muted); font-size: .78rem; text-align: center; line-height: 1.5; }
    .muted { color: var(--muted); }
    .hidden { display: none !important; }
    @media (max-width: 900px) {
      .dash { grid-template-columns: 1fr; }
      .topbar { flex-direction: column; align-items: flex-start; }
      .prop { grid-template-columns: 1fr auto auto; }
      .prop .spark { display: none; }
    }
  </style>
</head>
<body>
  <header class="topbar">
    <div class="brand">
      <div class="mark">H</div>
      <div>
        <div class="brand-name">HBA</div>
        <div class="brand-sub">Sports Intelligence</div>
      </div>
    </div>
    <nav>
      <button class="tab" id="tab-nba" onclick="setSport('nba')">NBA</button>
      <button class="tab active" id="tab-football" onclick="setSport('football')">Fútbol</button>
      <button class="tab disabled" disabled>Tenis <small>Próximamente</small></button>
      <button class="tab disabled" disabled>E-Sports <small>Próximamente</small></button>
    </nav>
  </header>

  <main>
    <div class="search-wrap" id="ft-search-wrap">
      <span class="search-icon">⌕</span>
      <input id="main-search" placeholder="Busca un equipo o jugador" autocomplete="off">
      <div class="suggest" id="suggest"></div>
    </div>
    <div class="chips" id="chips"></div>



    <div id="ft-toolbar" class="toolbar hidden"></div>
    <p id="status" class="hint"></p>
    <div id="home"></div>
    <div id="dash" class="hidden"></div>
  </main>

  <footer class="footer">
    Fuentes: API-Football y stats de la NBA. El análisis es generado con Grok (xAI) a partir de esos datos.<br>
    18+ Juega con responsabilidad. Este contenido es informativo y no constituye consejo de apuestas. Si el juego te genera un problema, busca ayuda en tu país.
  </footer>

<script>
const API_BASE = "https://hba-backend.onrender.com";
const DEFAULT_LEAGUE = 239;
const POPULAR_LEAGUES = [
  { id: 239, name: "Liga BetPlay" },
  { id: 39, name: "Premier League" },
  { id: 140, name: "La Liga" },
  { id: 135, name: "Serie A" },
  { id: 78, name: "Bundesliga" },
  { id: 61, name: "Ligue 1" },
  { id: 128, name: "Liga Argentina" },
  { id: 71, name: "Brasileirão" },
  { id: 262, name: "Liga MX" },
  { id: 253, name: "MLS" },
  { id: 2, name: "Champions" },
  { id: 13, name: "Libertadores" }
];

let sport = "football";
let currentLeague = DEFAULT_LEAGUE;
let currentTeams = [];
let currentSquad = [];
let dashState = null; // {kind, payload, market}
let chartInst = null;
let searchTimer = null;

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
}
function formatError(data) {
  const d = data && data.detail;
  if (!d) return "No se pudo completar la consulta.";
  if (typeof d === "string") return d;
  if (Array.isArray(d)) return d.map(x => x && x.msg).filter(Boolean).join(". ") || "Revisa los datos e inténtalo de nuevo.";
  return "No se pudo completar la consulta.";
}
function setStatus(msg, isErr) {
  const el = document.getElementById("status");
  el.className = isErr ? "err" : "hint";
  el.textContent = msg || "";
}
function sparkSvg(values) {
  const nums = (values || []).map(v => Number(v.value)).filter(v => !Number.isNaN(v));
  if (nums.length < 2) return "";
  const w = 72, h = 22, min = Math.min(...nums), max = Math.max(...nums);
  const span = max - min || 1;
  const pts = nums.map((n, i) => {
    const x = (i / (nums.length - 1)) * (w - 2) + 1;
    const y = h - 2 - ((n - min) / span) * (h - 4);
    return x.toFixed(1) + "," + y.toFixed(1);
  }).join(" ");
  return `<svg class="spark" width="${w}" height="${h}" viewBox="0 0 ${w} ${h}" aria-hidden="true"><polyline fill="none" stroke="#5b8cff" stroke-width="1.6" points="${pts}"/></svg>`;
}

function setSport(name) {
  if (name !== "nba" && name !== "football") return;
  sport = name;
  document.getElementById("tab-nba").classList.toggle("active", name === "nba");
  document.getElementById("tab-football").classList.toggle("active", name === "football");
  document.getElementById("ft-search-wrap").classList.remove("hidden");
  document.getElementById("chips").classList.remove("hidden");
  document.getElementById("suggest").classList.remove("open");
  searchInput.value = "";
  searchInput.placeholder = name === "nba"
    ? "Busca un jugador o equipo (Luka Doncic, Tatum, Lakers…)"
    : "Busca un equipo o jugador (Millonarios, Falcao, Arsenal, Saka…)";
  if (name === "football") {
    if (dashState && (dashState.kind === "team" || dashState.kind === "player")) renderFromState();
    else loadLeague(currentLeague);
  } else if (dashState && dashState.kind === "nba") {
    renderFromState();
  } else {
    loadNbaHome();
  }
}

function renderChips() {
  document.getElementById("chips").innerHTML = POPULAR_LEAGUES.map(lg =>
    `<button class="chip${lg.id === currentLeague ? " active" : ""}" onclick="loadLeague(${lg.id})">${escapeHtml(lg.name)}</button>`
  ).join("");
}

async function loadLeague(id) {
  currentLeague = id;
  dashState = null;
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("ft-toolbar").classList.add("hidden");
  renderChips();
  const home = document.getElementById("home");
  setStatus("Cargando equipos… Si el servidor estaba dormido, puede tardar unos segundos.");
  home.innerHTML = "";
  try {
    const res = await fetch(`${API_BASE}/api/football/teams?league=${id}`);
    const data = await res.json();
    if (!res.ok) { setStatus(formatError(data), true); return; }
    currentTeams = data.teams || [];
    setStatus(`${data.league_name || ""} · temporada ${data.season || ""}`.trim());
    home.innerHTML = `<div class="grid">` + currentTeams.map(t => `
      <div class="team-card" data-id="${t.id}" data-name="${escapeHtml(t.name)}">
        ${t.logo ? `<img src="${t.logo}" alt="">` : ""}
        <strong>${escapeHtml(t.name)}</strong>
        <span>${escapeHtml((t.venue && t.venue.city) || t.code || "")}</span>
      </div>`).join("") + `</div>`;
    home.querySelectorAll(".team-card").forEach(el => el.addEventListener("click", () => openTeam(Number(el.dataset.id), el.dataset.name)));
  } catch (e) {
    setStatus("Error de conexión. Si el servidor estaba dormido, inténtalo de nuevo.", true);
  }
}

const searchInput = document.getElementById("main-search");
const suggestBox = document.getElementById("suggest");
searchInput.addEventListener("input", () => {
  clearTimeout(searchTimer);
  const q = searchInput.value.trim();
  if (q.length < 2) { suggestBox.classList.remove("open"); return; }
  searchTimer = setTimeout(() => runSearch(q), 280);
});
searchInput.addEventListener("keydown", ev => { if (ev.key === "Enter") { ev.preventDefault(); runSearch(searchInput.value.trim(), true); } });
document.addEventListener("click", ev => { if (!ev.target.closest(".search-wrap")) suggestBox.classList.remove("open"); });

async function runSearch(q, openFirst) {
  if (!q || q.length < 2) return;
  try {
    const endpoint = sport === "nba" ? "/api/nba/search" : "/api/football/search";
    const res = await fetch(`${API_BASE}${endpoint}?q=${encodeURIComponent(q)}`);
    const data = await res.json();
    const teams = data.teams || [];
    const players = data.players || [];
    if (openFirst && teams[0]) { suggestBox.classList.remove("open"); openEntity("team", teams[0]); return; }
    if (openFirst && players[0]) { suggestBox.classList.remove("open"); openEntity("player", players[0]); return; }
    let html = "";
    if (teams.length) {
      html += `<div class="sg-sec">Equipos</div>` + teams.map(t => `
        <div class="sg-item" data-kind="team" data-id="${t.id}" data-name="${escapeHtml(t.name)}">
          ${t.logo ? `<img src="${t.logo}" alt="">` : ""}
          <div><strong>${escapeHtml(t.name)}</strong><div class="muted" style="font-size:.75rem">${escapeHtml(t.country || "")}</div></div>
        </div>`).join("");
    }
    if (players.length) {
      html += `<div class="sg-sec">Jugadores</div>` + players.map(p => `
        <div class="sg-item" data-kind="player" data-id="${p.id}" data-name="${escapeHtml(p.fullname || p.name)}" data-team="${p.team_id || ""}">
          ${p.photo ? `<img src="${p.photo}" alt="">` : ""}
          <div><strong>${escapeHtml(p.fullname || p.name)}</strong><div class="muted" style="font-size:.75rem">${escapeHtml(p.position || "")} ${escapeHtml(p.nationality || "")}</div></div>
        </div>`).join("");
    }
    if (!html) html = `<div class="sg-item muted">Sin resultados</div>`;
    suggestBox.innerHTML = html;
    suggestBox.classList.add("open");
    suggestBox.querySelectorAll(".sg-item[data-id]").forEach(el => {
      el.addEventListener("click", () => {
        suggestBox.classList.remove("open");
        searchInput.value = el.dataset.name || "";
        openEntity(el.dataset.kind, { id: el.dataset.id, name: el.dataset.name, team_id: el.dataset.team });
      });
    });
  } catch (e) {
    suggestBox.innerHTML = `<div class="sg-item err">Error de conexión</div>`;
    suggestBox.classList.add("open");
  }
}


function openEntity(kind, item) {
  suggestBox.classList.remove("open");
  if (!item) return;
  if (kind === "team") {
    if (sport === "nba") openNbaTeam(item.id, item.name);
    else openTeam(Number(item.id), item.name);
  } else if (sport === "nba") {
    openNbaPlayer(item.id, item.name || item.fullname, item.team_id);
  } else {
    openPlayer(Number(item.id), item.name || item.fullname, item.team_id ? Number(item.team_id) : undefined);
  }
}

let nbaTeams = [];

function renderNbaChips(activeId) {
  const popular = (nbaTeams.length ? nbaTeams : currentTeams).filter(t => t.popular);
  const chips = document.getElementById("chips");
  chips.innerHTML = `<button class="chip${!activeId ? " active" : ""}" data-all="1">Todos</button>` +
    popular.map(t => `<button class="chip${String(activeId)===String(t.id)?" active":""}" data-id="${t.id}" data-name="${escapeHtml(t.name)}">${escapeHtml(t.short_name || t.name)}</button>`).join("");
  chips.querySelectorAll(".chip").forEach(el => el.addEventListener("click", () => {
    if (el.dataset.all) loadNbaHome();
    else openNbaTeam(el.dataset.id, el.dataset.name);
  }));
}

function renderNbaTeamGrid(teams) {
  const home = document.getElementById("home");
  home.innerHTML = `<div class="grid">` + (teams || []).map(t => `
    <div class="team-card" data-id="${t.id}" data-name="${escapeHtml(t.name)}">
      ${t.logo ? `<img src="${t.logo}" alt="">` : ""}
      <strong>${escapeHtml(t.name)}</strong>
      <span>${escapeHtml(t.short_name || "NBA")}</span>
    </div>`).join("") + `</div>`;
  home.querySelectorAll(".team-card").forEach(el => el.addEventListener("click", () => openNbaTeam(el.dataset.id, el.dataset.name)));
}

async function loadNbaHome() {
  dashState = null;
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("ft-toolbar").classList.add("hidden");
  const home = document.getElementById("home");
  home.innerHTML = "";
  setStatus("Cargando equipos NBA… Si el servidor estaba dormido, puede tardar unos segundos.");
  try {
    const res = await fetch(`${API_BASE}/api/nba/teams`);
    const data = await res.json();
    if (!res.ok) { setStatus(formatError(data), true); return; }
    nbaTeams = currentTeams = data.teams || [];
    renderNbaChips();
    setStatus("NBA");
    renderNbaTeamGrid(nbaTeams);
  } catch (e) {
    setStatus("Error de conexión. Si el servidor estaba dormido, inténtalo de nuevo.", true);
  }
}

async function openNbaTeam(id, name) {
  document.getElementById("dash").classList.add("hidden");
  document.getElementById("ft-toolbar").classList.add("hidden");
  dashState = null;
  if (nbaTeams.length) renderNbaChips(id);
  setStatus(`Cargando plantilla de ${name}…`);
  const home = document.getElementById("home");
  home.innerHTML = "";
  try {
    const res = await fetch(`${API_BASE}/api/nba/roster?team_id=${encodeURIComponent(id)}`);
    const data = await res.json();
    if (!res.ok) { setStatus(formatError(data), true); return; }
    const team = data.team || { id, name };
    const players = data.players || [];
    setStatus(team.name || name);
    if (nbaTeams.length) renderNbaChips(id);

function snapHalf(n) {
  const x = Number(n);
  if (!Number.isFinite(x)) return 0.5;
  return Math.max(0.5, Math.round(x - 0.5) + 0.5);
}
function sideLabel(side) { return side === "no" ? "No" : "Sí"; }
function recomputeMarket(stat, line) {
  if (stat.kind === "yesno") {
    const side = (line === "no" || line === "No") ? "no" : "yes";
    const values = (stat.values || []).map(v => {
      const happened = Number(v.value) === 1;
      return { ...v, line: side, over: side === "yes" ? happened : !happened };
    });
    const games = values.length;
    const hits = values.filter(v => v.over).length;
    const yesHits = values.filter(v => Number(v.value) === 1).length;
    const yesRate = games ? Math.round(yesHits * 1000 / games) / 10 : null;
    return {
      ...stat, line: side, side, values, hits, games,
      yes_rate: yesRate,
      no_rate: yesRate == null ? null : Math.round((100 - yesRate) * 10) / 10,
      avg: games ? Math.round(yesHits / games * 100) / 100 : null,
      hit_rate: games ? Math.round(hits * 1000 / games) / 10 : null
    };
  }
  const snapped = snapHalf(line);
  const values = (stat.values || []).map(v => ({ ...v, line: snapped, over: Number(v.value) > snapped }));
  const games = values.length;
  const hits = values.filter(v => v.over).length;
  const avg = games ? Math.round(values.reduce((s, v) => s + Number(v.value), 0) / games * 100) / 100 : null;
  return { ...stat, line: snapped, values, hits, games, avg, hit_rate: games ? Math.round(hits * 1000 / games) / 10 : null };
}

function clientRecommend(market) {
  if (!market || !market.games) return { lean: "NEUTRAL", confidence: 1 };
  const hit = market.hit_rate;
  const games = market.games;
  const avg = market.avg;
  const line = market.line;
  let lean;
  if (market.kind === "yesno") {
    const yesRate = market.yes_rate;
    if (yesRate >= 65) lean = "SI";
    else if (yesRate <= 35) lean = "NO";
    else lean = "NEUTRAL";
  } else if (hit >= 65 && avg != null && avg > line) lean = "OVER";
  else if (hit <= 35 && avg != null && avg < line) lean = "UNDER";
  else lean = "NEUTRAL";
  let conf;
  if (games < 5) conf = 2;
  else if (lean === "NEUTRAL") conf = (hit >= 45 && hit <= 55) ? 3 : 2;
  else if ((hit >= 75 && games >= 8) || (market.kind === "yesno" && (market.yes_rate >= 75 || market.yes_rate <= 25) && games >= 8)) conf = 5;
  else if (hit >= 65 || hit <= 35) conf = 4;
  else conf = 3;
  return { lean, confidence: conf, market: market.key, label: market.label, line: market.kind === "yesno" ? (market.side || market.line) : line, hit_rate: hit, avg };
}
function activeMarket() {
  if (!dashState || !dashState.payload) return null;
  const stats = dashState.payload.stats || {};
  return stats[dashState.market] || stats[dashState.payload.primary] || Object.values(stats)[0];
}

function renderGauge(pct) {
  const p = Math.max(0, Math.min(100, Number(pct) || 0));
  const color = p >= 55 ? "var(--green)" : p <= 40 ? "var(--red)" : "var(--gold)";
  const label = (pct == null || Number.isNaN(Number(pct))) ? "–" : p.toFixed(0);
  return `<div class="gauge-wrap"><div class="gauge" style="background: conic-gradient(${color} ${p}%, #243049 0)"><span>${label}%</span></div></div>`;
}
function renderStars(n) {
  const c = Math.max(1, Math.min(5, Number(n) || 1));
  return `<div class="stars">${"★".repeat(c)}${"☆".repeat(5-c)}</div>`;
}
function renderAI(text) {
  if (!text) return `<div class="card ai" id="ai-card"><h3>Análisis de IA</h3><p class="hint">Preparando análisis…</p></div>`;
  return `<div class="card ai" id="ai-card"><h3>Análisis de IA</h3><p>${escapeHtml(text)}</p></div>`;
}

function renderFromState() {
  const dash = document.getElementById("dash");
  if (!dashState || !dashState.payload) { dash.classList.add("hidden"); return; }
  dash.classList.remove("hidden");
  const data = dashState.payload;
  const stats = data.stats || {};
  const market = activeMarket();
  const rec = clientRecommend(market) || data.recommendation || {};
  const isPlayer = dashState.kind === "player" || dashState.kind === "nba";
  const isYesNo = market && market.kind === "yesno";
  const person = isPlayer ? (data.player || {}) : (data.team || {});
  const photo = isPlayer ? person.photo : person.logo;
  const title = isPlayer ? (person.fullname || person.name) : person.name;
  const teamName = (data.team && data.team.name) || person.team_name || "";
  const sub = isPlayer
    ? [teamName, person.position, `${data.played || 0} partidos`].filter(Boolean).join(" · ")
    : `${(data.league && data.league.name) || ""} · temporada ${data.season || ""} · ${data.form || ""}`;
  const pct = market && market.hit_rate;
  const lineTxt = market
    ? (isYesNo ? `${market.label} ${sideLabel(market.side || market.line)}` : `${market.label} ${market.line}`)
    : "";
  const leanRaw = (rec.lean || "NEUTRAL");
  const lean = leanRaw === "SÍ" ? "SI" : leanRaw;
  const leanPretty = lean === "SI" ? "SÍ" : lean;
  const leanLine = isYesNo ? "" : (market ? market.line : "");
  const leanLabel = market ? `${leanPretty}${leanLine !== "" ? " " + leanLine : ""} ${market.label}` : leanPretty;

  const formHint = !isPlayer && data.record
    ? `${data.record.wins}W-${data.record.draws}E-${data.record.losses}D`
    : (isPlayer && data.season_totals && data.season_totals.leagues
        ? data.season_totals.leagues.map(l => `${l.league || ""}: ${l.appearances || 0} PJ, ${l.goals ?? "–"} goles`).join(" · ")
        : (dashState.kind === "nba" ? `${data.played || (market && market.games) || 0} partidos` : ""));

  const rowsHtml = Object.values(stats).map(m => {
    if (!m) return "";
    if (m.key === "saves" && dashState.kind === "player" && !data.is_goalkeeper) return "";
    const hot = m.hit_rate >= 60 ? "hot" : m.hit_rate <= 40 ? "cold" : "";
    const active = m.key === (dashState.market) ? " active" : "";
    const avgTxt = m.kind === "yesno"
      ? (m.yes_rate == null ? "–" : m.yes_rate + "% Sí")
      : (m.avg == null ? "–" : m.avg + " avg");
    const lineCtl = m.kind === "yesno"
      ? `<div class="seg yesno" data-key="${m.key}"><button type="button" data-side="yes" class="${(m.side||m.line)!=="no"?"active":""}">Sí</button><button type="button" data-side="no" class="${(m.side||m.line)==="no"?"active":""}">No</button></div>`
      : `<div class="step" data-key="${m.key}"><button type="button" data-dir="-1">−</button><span>${m.line}</span><button type="button" data-dir="1">+</button></div>`;
    return `<div class="prop${active}" data-key="${m.key}">
      <div class="name">${escapeHtml(m.label)}</div>
      <div class="avg">${avgTxt}</div>
      <div class="line">${lineCtl}</div>
      <div class="pct ${hot}">${m.hit_rate == null ? "–" : m.hit_rate + "%"}</div>
      ${sparkSvg(m.values)}
    </div>`;
  }).join("");

  const values = (market && market.values) ? market.values : [];
  const tableRows = values.map(v => `
    <tr>
      <td>${escapeHtml((v.date || "").slice(0,10))}</td>
      <td>${escapeHtml(v.opponent || "")} ${v.venue === "home" ? "(L)" : v.venue === "away" ? "(V)" : ""}</td>
      <td>${isYesNo ? sideLabel(v.line) : v.line}</td>
      <td>${isYesNo ? (v.display || sideLabel(Number(v.value)===1?"yes":"no")) : v.value}</td>
      <td><span class="pill ${v.over ? "hit" : "miss"}">${v.over ? "HIT" : "MISS"}</span></td>
    </tr>`).join("");

  const h2h = (!isPlayer && data.h2h && data.h2h.length) ? `
    <div class="card"><h3 style="margin-bottom:8px;font-size:.9rem;">H2H reciente</h3>
      ${data.h2h.slice(0,8).map(m => `<div class="hint" style="margin:4px 0">${escapeHtml((m.date||"").slice(0,10))} · ${escapeHtml(m.home)} ${m.goals_home}-${m.goals_away} ${escapeHtml(m.away)}</div>`).join("")}
    </div>` : "";

  dash.innerHTML = `
    <div class="dash">
      <div class="col">
        <div class="card kpi">
          <div>
            <div class="lbl">Hit rate · ${escapeHtml(lineTxt)}</div>
            <div class="num">${pct == null ? "–" : pct.toFixed(1) + "%"}</div>
            <div class="hint" style="margin-top:8px">${escapeHtml(formHint)} · ${market ? market.hits + "/" + market.games + (isYesNo ? ((market.side||market.line)==="no" ? " No" : " Sí") : " over") : ""}</div>
          </div>
        </div>
        <div class="card"><div class="chart-box"><canvas id="main-chart"></canvas></div></div>
        <div class="card">
          <h3 style="margin-bottom:8px;font-size:.9rem;">Desglose de props</h3>
          <div class="rows">${rowsHtml}</div>
        </div>
        <div class="card">
          <h3 style="margin-bottom:8px;font-size:.9rem;">Partidos recientes</h3>
          <div style="overflow-x:auto"><table>
            <thead><tr><th>Fecha</th><th>Rival</th><th>Línea</th><th>Valor</th><th></th></tr></thead>
            <tbody>${tableRows || `<tr><td colspan="5" class="hint">Sin partidos para esta métrica.</td></tr>`}</tbody>
          </table></div>
        </div>
        ${h2h}
      </div>
      <div class="col">
        <div class="card spot">
          ${photo ? `<img class="${isPlayer ? "" : "crest"}" src="${photo}" alt="">` : ""}
          <h2>${escapeHtml(title || "")}</h2>
          <div class="hint">${escapeHtml(sub)}</div>
          ${renderGauge(pct)}
          ${renderStars(rec.confidence)}
          <div class="lean ${lean}">LEAN ${escapeHtml(leanLabel)}</div>
          <div class="hint" style="margin-top:8px">${isYesNo ? `Sí ${market && market.yes_rate != null ? market.yes_rate + "%" : "–"} · No ${market && market.no_rate != null ? market.no_rate + "%" : "–"}` : `Promedio ${market && market.avg != null ? market.avg : "–"} vs línea ${market ? market.line : "–"}`}</div>
        </div>
        ${renderAI(data.ai_analysis)}
        ${isPlayer ? '' : '<div class="card" id="squad-card"></div>'}
      </div>
    </div>`;

  if (!isPlayer && currentSquad.length) loadSquad(dashState.id);
  else if (!isPlayer) { /* squad loading */ }

  dash.querySelectorAll(".prop").forEach(el => el.addEventListener("click", ev => {
    if (ev.target.closest(".step, .yesno, button")) return;
    dashState.market = el.dataset.key;
    renderFromState();
  }));
  dash.querySelectorAll(".step button").forEach(btn => btn.addEventListener("click", ev => {
    ev.stopPropagation();
    const key = btn.parentElement.dataset.key;
    const dir = Number(btn.dataset.dir);
    const current = Number((dashState.payload.stats[key] || {}).line);
    const line = snapHalf(current + dir);
    dashState.payload.stats[key] = recomputeMarket(dashState.payload.stats[key], line);
    dashState.market = key;
    renderFromState();
  }));
  dash.querySelectorAll(".yesno button").forEach(btn => btn.addEventListener("click", ev => {
    ev.stopPropagation();
    const key = btn.parentElement.dataset.key;
    dashState.payload.stats[key] = recomputeMarket(dashState.payload.stats[key], btn.dataset.side);
    dashState.market = key;
    if (dashState.payload.recommendation) {
      dashState.payload.recommendation = Object.assign({}, dashState.payload.recommendation, { line: btn.dataset.side });
    }
    renderFromState();
  }));
  drawChart(values, isYesNo ? 0.5 : (market && market.line), market && market.label, isYesNo);
}

function drawChart(values, line, label, yesNo) {
  const canvas = document.getElementById("main-chart");
  if (!canvas || typeof Chart === "undefined") return;
  if (chartInst) chartInst.destroy();
  const series = [...(values || [])].reverse();
  const labels = series.map(v => (v.opponent || "").slice(0, 10) || (v.date || "").slice(5, 10));
  chartInst = new Chart(canvas.getContext("2d"), {
    type: "line",
    data: {
      labels,
      datasets: [
        {
          label: label || "Valor",
          data: series.map(v => v.value),
          borderColor: "#5b8cff",
          backgroundColor: "rgba(91,140,255,.12)",
          fill: true,
          tension: 0.25,
          pointRadius: 5,
          pointBackgroundColor: series.map(v => v.over ? "#2ee59d" : "#ff4d6a"),
          pointBorderColor: "#0b1020"
        },
        {
          label: yesNo ? "Sí / No" : "Línea",
          data: series.map(() => line),
          borderColor: "#f3c15e",
          borderDash: [6, 4],
          pointRadius: 0,
          fill: false
        }
      ]
    },
    options: {
      responsive: true,
      maintainAspectRatio: false,
      plugins: { legend: { labels: { color: "#8b9bb8", boxWidth: 12 } } },
      scales: {
        x: { ticks: { color: "#8b9bb8", maxRotation: 40, minRotation: 0, font: { size: 10 } }, grid: { display: false } },
        y: yesNo
          ? { min: 0, max: 1, ticks: { color: "#8b9bb8", stepSize: 1, callback: v => v === 1 ? "Sí" : v === 0 ? "No" : "" }, grid: { color: "rgba(36,48,73,.8)" } }
          : { ticks: { color: "#8b9bb8" }, grid: { color: "rgba(36,48,73,.8)" }, beginAtZero: true }
      }
    }
  });
}

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HBA Betting</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { font-family: 'Segoe UI', system-ui, sans-serif; background: #070b14; color: #e5e7eb; }
    .header { background: #0f172a; padding: 14px 28px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid #1e293b; }
    .logo { font-size: 1.6rem; font-weight: 700; color: #fbbf24; }
    .sports { display: flex; gap: 8px; }
    .sport-btn { background: #1e293b; border: none; color: white; padding: 8px 14px; border-radius: 999px; cursor: pointer; font-size: 0.88rem; }
    .sport-btn.active { background: #3b82f6; }
    .container { max-width: 1200px; margin: 24px auto; padding: 0 20px; }
    .card { background: #0f172a; border-radius: 16px; padding: 24px; border: 1px solid #1e293b; }
    .controls { display: flex; flex-wrap: wrap; gap: 10px; margin: 16px 0 20px; }
    input, select { padding: 10px 12px; border-radius: 8px; border: 1px solid #334155; background: #1e293b; color: white; }
    .analyze-btn { background: #10b981; border: none; padding: 10px 22px; border-radius: 8px; font-weight: 700; color: white; cursor: pointer; }
    .dashboard { display: grid; grid-template-columns: 1fr 300px; gap: 18px; margin-top: 10px; }
    .metrics-row { display: flex; gap: 12px; margin-bottom: 16px; }
    .metric { background: #1e293b; padding: 14px 18px; border-radius: 12px; flex: 1; text-align: center; }
    .metric span { display: block; font-size: 1.7rem; font-weight: 700; color: #10b981; }
    .analysis { background: #1e293b; border-radius: 12px; padding: 16px; margin-bottom: 16px; border-left: 3px solid #fbbf24; line-height: 1.5; }
    .chart-box { background: #1e293b; border-radius: 12px; padding: 12px; }
    .side-panel { background: #1e293b; border-radius: 12px; padding: 16px; }
    .support { margin-top: 28px; text-align: center; color: #94a3b8; font-size: 0.85rem; }
    .mode-selector { display: flex; gap: 8px; margin-bottom: 16px; }
    .mode-btn { background: #1e293b; border: none; color: white; padding: 8px 16px; border-radius: 8px; cursor: pointer; }
    .mode-btn.active { background: #10b981; }
    .hint { color: #94a3b8; font-size: 0.85rem; margin: 8px 0; }
    .team-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; margin-top: 12px; }
    .team-card { background: #1e293b; border-radius: 12px; padding: 14px 10px; text-align: center; cursor: pointer; border: 1px solid #334155; }
    .team-card:hover, .team-card.active { border-color: #3b82f6; }
    .team-card img { width: 56px; height: 56px; object-fit: contain; margin-bottom: 8px; }
    .team-card strong { display: block; font-size: 0.9rem; }
    .team-card span { display: block; font-size: 0.75rem; color: #94a3b8; margin-top: 4px; }
    .player-list { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; margin-top: 12px; }
    .player-card { background: #1e293b; border-radius: 10px; padding: 10px 12px; display: flex; gap: 10px; align-items: center; }
    .player-card img { width: 42px; height: 42px; border-radius: 50%; object-fit: cover; background: #0f172a; }
    .player-card .meta { font-size: 0.75rem; color: #94a3b8; }
    .match-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; background: #1e293b; border-radius: 10px; padding: 10px 14px; margin-bottom: 8px; font-size: 0.9rem; }
    .match-row img { width: 24px; height: 24px; object-fit: contain; }
    .score { font-weight: 700; color: #fbbf24; min-width: 48px; text-align: center; }
    .league-hit { display: flex; align-items: center; gap: 8px; background: #1e293b; border-radius: 8px; padding: 8px 12px; margin: 6px 0; cursor: pointer; border: 1px solid #334155; }
    .league-hit:hover { border-color: #3b82f6; }
    .league-hit img { width: 24px; height: 24px; object-fit: contain; }
    #ft-league { min-width: 240px; }
    @media (max-width: 800px) {
      .header { flex-direction: column; align-items: flex-start; gap: 10px; padding: 12px 16px; }
      .sports { flex-wrap: wrap; }
      .dashboard { grid-template-columns: 1fr; }
      .controls { flex-direction: column; }
      .controls input, .controls select, .analyze-btn, #ft-league { width: 100%; min-width: 0; }
      .container { margin: 16px auto; padding: 0 12px; }
      .card { padding: 16px; }
      .team-grid { grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
      .player-list { grid-template-columns: 1fr; }
      .match-row { flex-wrap: wrap; justify-content: center; text-align: center; }
    }

  </style>
</head>
<body>

  <div class="header">
    <div class="logo">HBA BETTING</div>
    <div class="sports">
      <button class="sport-btn active" onclick="showSport('nba')">🏀 NBA</button>
      <button class="sport-btn" onclick="showSport('football')">⚽ Fútbol</button>
      <button class="sport-btn">🎾 Tenis <span style="font-size:0.75rem; opacity:0.7;">(en desarrollo)</span></button>
      <button class="sport-btn">🎮 E-Sports <span style="font-size:0.75rem; opacity:0.7;">(en desarrollo)</span></button>
    </div>
  </div>

  <div class="container">
    <!-- NBA Section -->
    <div id="nba-section" class="card">
      <h2>NBA Player Props</h2>
      <div class="controls">
        <input type="text" id="player" placeholder="Jugador" value="Luka Doncic">
        <select id="prop">
          <option value="PTS">Puntos</option>
          <option value="REB">Rebotes</option>
          <option value="AST">Asistencias</option>
          <option value="PRA">PRA</option>
          <option value="PR">PR</option>
          <option value="PA">PA</option>
          <option value="RA">RA</option>
          <option value="FG3M">Triples</option>
          <option value="MIN">Minutos</option>
          <option value="DD">Double-Double</option>
          <option value="TD">Triple-Double</option>
        </select>
        <select id="line"></select>
        <button class="analyze-btn" onclick="analyzeNBA()">Analizar</button>
      </div>
      <div id="nba-result"></div>
    </div>

    <!-- Football Section -->
    <div id="football-section" class="card" style="display:none;">
      <h2>Fútbol</h2>
      <div class="mode-selector">
        <button class="mode-btn active" onclick="setFootballMode('teams')">Equipos</button>
        <button class="mode-btn" onclick="setFootballMode('players')">Jugadores</button>
        <button class="mode-btn" onclick="setFootballMode('h2h')">H2H</button>
      </div>
      <div class="controls">
        <select id="ft-league" onchange="onLeagueChange()">
        </select>
        <input type="text" id="ft-league-search" placeholder="Buscar otra liga..." onkeydown="if(event.key==='Enter')searchLeagues()">
        <button class="sport-btn" onclick="searchLeagues()">Buscar liga</button>
        <span id="ft-season-label" class="hint" style="margin:0;align-self:center;"></span>
        <input type="text" id="ft-team" placeholder="Equipo (ej: Millonarios)" value="Millonarios">
        <input type="text" id="ft-team2" placeholder="Rival (ej: Nacional)" value="Atletico Nacional" style="display:none;">
        <button class="analyze-btn" onclick="analyzeFootball()">Analizar</button>
      </div>
      <div id="ft-league-results"></div>
      <div id="football-result"></div>
    </div>

    <div class="support">Soporte: <b>soporte@hbabetting.com</b></div>
  </div>

  <script>
    const API_BASE = "https://hba-backend.onrender.com";
    const DEFAULT_LEAGUE = 239;
    const POPULAR_LEAGUES = [
      { id: 239, name: "Liga BetPlay (Primera A)", country: "Colombia" },
      { id: 39, name: "Premier League", country: "Inglaterra" },
      { id: 140, name: "La Liga", country: "España" },
      { id: 135, name: "Serie A", country: "Italia" },
      { id: 78, name: "Bundesliga", country: "Alemania" },
      { id: 61, name: "Ligue 1", country: "Francia" },
      { id: 128, name: "Liga Profesional", country: "Argentina" },
      { id: 71, name: "Brasileirão (Serie A)", country: "Brasil" },
      { id: 262, name: "Liga MX", country: "México" },
      { id: 253, name: "MLS", country: "EE. UU." },
      { id: 2, name: "Champions League", country: "Europa" },
      { id: 13, name: "Copa Libertadores", country: "Sudamérica" }
    ];
    const lineSelect = document.getElementById('line');
    for (let i = 0; i < 100; i++) {
      const val = (i + 0.5).toFixed(1);
      const opt = document.createElement('option');
      opt.value = val;
      opt.text = val;
      if (val === "25.5") opt.selected = true;
      lineSelect.appendChild(opt);
    }

    let chartInstance = null;
    let footballMode = 'teams';
    let cachedTeams = [];
    let currentSeason = null;
    let extraLeagues = [];

    function fillLeagueSelect(selectedId) {
      const sel = document.getElementById('ft-league');
      const current = selectedId || Number(sel.value) || DEFAULT_LEAGUE;
      const all = [...POPULAR_LEAGUES];
      extraLeagues.forEach(lg => {
        if (!all.some(p => p.id === lg.id)) all.push(lg);
      });
      sel.innerHTML = all.map(lg =>
        `<option value="${lg.id}" ${lg.id === current ? 'selected' : ''}>${lg.name} — ${lg.country}</option>`
      ).join('');
    }

    function selectedLeague() {
      return Number(document.getElementById('ft-league').value) || DEFAULT_LEAGUE;
    }

    function onLeagueChange() {
      currentSeason = null;
      cachedTeams = [];
      document.getElementById('ft-league-results').innerHTML = "";
      analyzeFootball();
    }

    async function searchLeagues() {
      const q = document.getElementById('ft-league-search').value.trim();
      const box = document.getElementById('ft-league-results');
      if (!q) { box.innerHTML = ""; return; }
      box.innerHTML = "<p class='hint'>Buscando ligas...</p>";
      try {
        const response = await fetch(`${API_BASE}/api/football/leagues?search=${encodeURIComponent(q)}`);
        const data = await response.json();
        if (!response.ok) {
          box.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
          return;
        }
        const leagues = data.leagues || [];
        if (!leagues.length) {
          box.innerHTML = "<p class='hint'>No se encontraron ligas.</p>";
          return;
        }
        box.innerHTML = leagues.slice(0, 12).map(lg =>
          `<div class="league-hit" data-id="${lg.id}" data-name="${escapeHtml(lg.name || '')}" data-country="${escapeHtml(lg.country || '')}">
            ${lg.logo ? `<img src="${lg.logo}" alt="">` : ""}
            <div><strong>${escapeHtml(lg.name || "")}</strong><div class="meta" style="font-size:0.75rem;color:#94a3b8;">${escapeHtml(lg.country || "")} · temporada ${lg.season || ""}</div></div>
          </div>`
        ).join('');
        box.querySelectorAll('.league-hit').forEach(el => {
          el.addEventListener('click', () => pickLeague(Number(el.dataset.id), el.dataset.name, el.dataset.country));
        });
      } catch (err) {
        box.innerHTML = `<p style="color:#ef4444">Error de conexión.</p>`;
      }
    }

    function pickLeague(id, name, country) {
      extraLeagues = extraLeagues.filter(l => l.id !== id);
      extraLeagues.unshift({ id, name, country });
      fillLeagueSelect(id);
      document.getElementById('ft-league-results').innerHTML = "";
      document.getElementById('ft-league-search').value = "";
      onLeagueChange();
    }


    function escapeHtml(s) {
      return String(s ?? "").replace(/[&<>"']/g, c => ({
        "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;"
      }[c]));
    }

    function formatError(data) {
      const d = data && data.detail;
      if (!d) return "No se pudo completar la consulta.";
      if (typeof d === "string") return d;
      if (Array.isArray(d)) {
        const msgs = d.map(x => (x && x.msg) || "").filter(Boolean);
        return msgs.join(". ") || "Revisa los datos e inténtalo de nuevo.";
      }
      return "No se pudo completar la consulta.";
    }

    fillLeagueSelect(DEFAULT_LEAGUE);

    function showSport(sport) {
      document.querySelectorAll('.sport-btn').forEach(btn => btn.classList.remove('active'));
      const btn = event.target.closest('.sport-btn') || event.target;
      btn.classList.add('active');
      
      document.getElementById('nba-section').style.display = sport === 'nba' ? 'block' : 'none';
      document.getElementById('football-section').style.display = sport === 'football' ? 'block' : 'none';
      if (sport === 'football') analyzeFootball();
    }

    function setFootballMode(mode) {
      footballMode = mode;
      document.querySelectorAll('.mode-btn').forEach(btn => btn.classList.remove('active'));
      event.target.classList.add('active');
      document.getElementById('ft-team2').style.display = mode === 'h2h' ? 'block' : 'none';
      analyzeFootball();
    }


    function renderTeams(teams, selectedId) {
      if (!teams.length) return `<p class="hint">No se encontraron equipos.</p>`;
      return `<div class="team-grid">` + teams.map(t => `
        <div class="team-card${t.id === selectedId ? ' active' : ''}" onclick="loadSquad(${t.id})">
          ${t.logo ? `<img src="${t.logo}" alt="${escapeHtml(t.name)}">` : ''}
          <strong>${escapeHtml(t.name)}</strong>
          <span>${escapeHtml((t.venue && t.venue.name) ? t.venue.name : (t.code || ''))}</span>
        </div>
      `).join('') + `</div>`;
    }

    function renderPlayers(players) {
      if (!players.length) return `<p class="hint">No se encontraron jugadores.</p>`;
      const order = { Goalkeeper: 1, Defender: 2, Midfielder: 3, Attacker: 4 };
      const labels = { Goalkeeper: 'Portero', Defender: 'Defensa', Midfielder: 'Volante', Attacker: 'Delantero' };
      const sorted = [...players].sort((a, b) => (order[a.position] || 9) - (order[b.position] || 9));
      return `<div class="player-list">` + sorted.map(p => `
        <div class="player-card">
          ${p.photo ? `<img src="${p.photo}" alt="${escapeHtml(p.name)}">` : ''}
          <div>
            <strong>${p.number != null ? p.number + '. ' : ''}${escapeHtml(p.name)}</strong>
            <div class="meta">${escapeHtml(labels[p.position] || p.position || '')}${p.age ? ' · ' + p.age + ' años' : ''}</div>
          </div>
        </div>
      `).join('') + `</div>`;
    }

    function renderMatches(matches) {
      if (!matches.length) return `<p class="hint">No se encontró historial.</p>`;
      return matches.map(m => {
        const date = m.date ? new Date(m.date).toLocaleDateString('es-CO') : '';
        return `<div class="match-row">
          <span>${m.home_logo ? `<img src="${m.home_logo}" alt=""> ` : ''}${m.home || ''}</span>
          <span class="score">${m.goals_home ?? '-'} : ${m.goals_away ?? '-'}</span>
          <span>${m.away || ''}${m.away_logo ? ` <img src="${m.away_logo}" alt="">` : ''}</span>
        </div><p class="hint" style="margin-top:-4px;margin-bottom:10px;">${date}${m.league ? ' · ' + m.league : ''}</p>`;
      }).join('');
    }

    async function loadTeamAnalysis(teamName, boxId) {
      const box = document.getElementById(boxId);
      if (!box) return;
      try {
        const response = await fetch(`${API_BASE}/football/team`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ team: teamName, league: selectedLeague() })
        });
        const data = await response.json();
        if (!response.ok) {
          box.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
          return;
        }
        const stats = data.stats || {};
        box.innerHTML = renderStanding(stats.standing) + renderAnalysis(data.ai_analysis);
      } catch (err) {
        box.innerHTML = `<p class="hint">No se pudo cargar el análisis. Si el servidor estaba dormido, pulsa Analizar de nuevo.</p>`;
      }
    }

    async function loadSquad(teamId, teamName) {
      teamName = teamName || (cachedTeams.find(t => t.id === teamId) || {}).name || 'el equipo';
      const resultDiv = document.getElementById('football-result');
      const teamsHtml = renderTeams(cachedTeams, teamId);
      resultDiv.innerHTML = teamsHtml + `<p>Cargando plantilla de ${escapeHtml(teamName)}...</p>`;
      try {
        const response = await fetch(`${API_BASE}/api/football/squad?team=${teamId}`);
        const data = await response.json();
        if (!response.ok) {
          resultDiv.innerHTML = teamsHtml + `<p style="color:#ef4444">${formatError(data)}</p>`;
          return;
        }
        const name = (data.team && data.team.name) || teamName;
        resultDiv.innerHTML = teamsHtml
          + `<div id="ft-analysis-box"><p class="hint">Preparando análisis de ${escapeHtml(name)}...</p></div>`
          + `<div class="analysis" style="margin-top:16px;"><strong>Plantilla de ${escapeHtml(name)}</strong></div>`
          + renderPlayers(data.players || []);
        await loadTeamAnalysis(name, "ft-analysis-box");
      } catch (err) {
        resultDiv.innerHTML = teamsHtml + `<p style="color:#ef4444">Error de conexión. Si el servidor estaba dormido, inténtalo de nuevo.</p>`;
      }
    }

    async function analyzeNBA() {
      const player = document.getElementById('player').value.trim();
      const prop = document.getElementById('prop').value;
      const line = parseFloat(document.getElementById('line').value);
      const resultDiv = document.getElementById('nba-result');

      resultDiv.innerHTML = "<p>Analizando...</p>";

      try {
        const response = await fetch(`${API_BASE}/analyze`, {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ player, prop, line, last_n: 12 })
        });

        const data = await response.json();

        if (!response.ok) {
          resultDiv.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
          return;
        }

        const s = data.stats;
        const games = data.games || [];
        const aiText = data.ai_analysis || "No se pudo generar análisis.";

        resultDiv.innerHTML = `
          <div class="dashboard">
            <div>
              <div class="metrics-row">
                <div class="metric">Promedio <span>${s.avg}</span></div>
                <div class="metric">Hit Rate <span>${s.hit_rate}%</span></div>
                <div class="metric">Partidos <span>${s.games}</span></div>
              </div>
              <div class="analysis">
                <strong>Análisis del Pick</strong><br>
                ${aiText}
              </div>
              <div class="chart-box">
                <canvas id="chart"></canvas>
              </div>
            </div>
            <div class="side-panel">
              <h4 style="margin-bottom:10px;">Resumen</h4>
              <p style="font-size:0.9rem; color:#94a3b8;">Línea: <b>${s.line}</b></p>
              <p style="font-size:0.9rem; color:#94a3b8; margin-top:6px;">Prop: <b>${s.prop}</b></p>
              <p style="margin-top:14px; font-size:0.85rem;">Verde = Superó la línea<br>Rojo = No la superó</p>
            </div>
          </div>
        `;

        if (chartInstance) chartInstance.destroy();
        const ctx = document.getElementById('chart').getContext('2d');
        chartInstance = new Chart(ctx, {
          type: 'bar',
          data: {
            labels: games.map((g, i) => g.opponent || `J${i+1}`),
            datasets: [{
              data: games.map(g => g[s.value_col] || 0),
              backgroundColor: games.map(g => g.Over ? '#10b981' : '#ef4444')
            }]
          },
          options: {
            plugins: { legend: { display: false } },
            scales: {
              y: { beginAtZero: true, grid: { color: '#334155' } },
              x: { 
                grid: { display: false },
                ticks: { maxRotation: 45, minRotation: 45, font: { size: 10 } }
              }
            }
          }
        });

      } catch (err) {
        resultDiv.innerHTML = `<p style="color:#ef4444">Error de conexión.</p>`;
      }
    }

    function renderAnalysis(text) {
      if (!text) return "";
      return `<div class="analysis"><strong>Análisis del Pick</strong><br>${escapeHtml(text)}</div>`;
    }

    function renderStanding(st) {
      if (!st) return "";
      return `<p class="hint">Tabla: puesto ${st.rank || "-"} · ${st.points ?? "-"} pts · racha ${st.form || "-"} · ${st.played ?? "-"} PJ (${st.win ?? "-"}W-${st.draw ?? "-"}E-${st.lose ?? "-"}D)</p>`;
    }

    async function analyzeFootball() {
      const team = document.getElementById('ft-team').value.trim();
      const team2 = document.getElementById('ft-team2').value.trim();
      const resultDiv = document.getElementById('football-result');
      const league = selectedLeague();

      resultDiv.innerHTML = "<p>Cargando... Si el servidor estaba dormido, puede tardar unos segundos.</p>";

      try {
        if (footballMode === 'h2h') {
          if (!team || !team2) {
            resultDiv.innerHTML = `<p style="color:#ef4444">Escribe los dos equipos para ver el cara a cara.</p>`;
            return;
          }
          const response = await fetch(`${API_BASE}/football/h2h`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team1: team, team2: team2, last: 10, league })
          });
          const data = await response.json();
          if (!response.ok) {
            resultDiv.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
            return;
          }
          const s1 = data.team1_data && data.team1_data.standing;
          const s2 = data.team2_data && data.team2_data.standing;
          resultDiv.innerHTML = `<div class="analysis"><strong>${team} vs ${team2}</strong></div>`
            + renderStanding(s1) + renderStanding(s2)
            + renderAnalysis(data.ai_analysis)
            + renderMatches(data.matches || []);
          return;
        }

        if (footballMode === 'players') {
          if (!team) {
            resultDiv.innerHTML = `<p style="color:#ef4444">Escribe un equipo para ver jugadores y el análisis.</p>`;
            return;
          }
          const response = await fetch(`${API_BASE}/football/team`, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ team, league })
          });
          const data = await response.json();
          if (!response.ok) {
            resultDiv.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
            return;
          }
          const stats = data.stats || {};
          const t = stats.team || {};
          const season = stats.season ? ` · temporada ${stats.season}` : "";
          const leagueName = (stats.league && stats.league.name) ? stats.league.name : "";
          resultDiv.innerHTML = `<div class="analysis"><strong>${t.name || team}</strong> — ${leagueName}${season}</div>`
            + renderStanding(stats.standing)
            + renderAnalysis(data.ai_analysis)
            + renderPlayers(stats.squad || []);
          return;
        }

        const response = await fetch(`${API_BASE}/api/football/teams?league=${league}`);
        const data = await response.json();
        if (!response.ok) {
          resultDiv.innerHTML = `<p style="color:#ef4444">${formatError(data)}</p>`;
          return;
        }

        cachedTeams = data.teams || [];
        currentSeason = data.season;
        const label = document.getElementById('ft-season-label');
        if (label) {
          const lg = data.league_name || "";
          label.textContent = `${lg}${data.season ? " · temporada " + data.season : ""}`;
        }

        let selected = null;
        if (team) {
          const q = team.toLowerCase();
          selected = cachedTeams.find(t => (t.name || '').toLowerCase().includes(q) || (t.code || '').toLowerCase() === q) || null;
        }

        resultDiv.innerHTML = renderTeams(cachedTeams, selected && selected.id);
        if (selected) await loadSquad(selected.id, selected.name);
      } catch (err) {
        resultDiv.innerHTML = `<p style="color:#ef4444">Error de conexión.</p>`;
      }
    }
  </script>

</body>
</html>
